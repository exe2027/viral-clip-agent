# tenants.yaml — lista blanca de tenants del panel (solo IDs, sin secretos).
#
# Regla 2026-11-18 (MEJORAS-PENDIENTES.md 2.1): el tenant NUNCA tiene
# valor por defecto. Todo proceso que hable con el panel debe traer
# PANEL_TENANT (del dispatch del Worker o del input del workflow) y el
# valor debe estar en esta lista; si no, el proceso aborta con error
# claro y sin tocar la red. Así un workflow sin esa variable no puede
# leer ni escribir la configuración de otro tenant por accidente.
#
# Regla 2026-11-19: el cerebro es GENÉRICO — no hay workflows por
# tenant ni secretos por tenant en GitHub. Cuando se crea una cuenta
# nueva, basta con añadir su ID aquí (y su login en el panel): su
# cerebro corre solo con su configuración del panel. "colega" se
# eliminó el 2026-11-19: nunca fue un usuario (era la palabra del
# usuario para "más usuarios, como kaez").
#
# Tenants reales (verificados en D1 `panel_users`, 2026-11-19):
#   sebastian — usuario `seba` (dueño)
#   kaez      — usuario `kaez` (usuario)
tenants:
  - sebastian
  - kaez
