# TEMPORAL (diagnóstico 2026-11-19): ¿::add-mask:: vacía un output entre jobs?
# Se borra tras el diagnóstico. Valores FALSOS, ningún secreto real.
# Variante 2: valores DISTINTOS para masked y plain (la primera prueba
# usaba el mismo valor en ambos y el add-mask lo contaminaba todo).
name: Test output con mascara
on:
  workflow_dispatch:
jobs:
  producer:
    runs-on: ubuntu-latest
    outputs:
      masked: ${{ steps.a.outputs.masked }}
      plain: ${{ steps.b.outputs.plain }}
    steps:
      - id: a
        run: |
          VAL="AAA-masked-value-111"
          echo "::add-mask::$VAL"
          echo "masked=$VAL" >> "$GITHUB_OUTPUT"
      - id: b
        run: |
          VAL="BBB-plain-value-222"
          echo "plain=$VAL" >> "$GITHUB_OUTPUT"
  consumer:
    needs: producer
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -n "${{ needs.producer.outputs.masked }}" ]; then echo "MASKED OK"; else echo "MASKED EMPTY"; fi
          if [ -n "${{ needs.producer.outputs.plain }}" ]; then echo "PLAIN OK"; else echo "PLAIN EMPTY"; fi
