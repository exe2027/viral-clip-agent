# Se borra tras el diagnóstico. Valores FALSOS, ningún secreto real.
name: Test output con mascara
on:
  workflow_dispatch:
jobs:
  producer:
    runs-on: ubuntu-latest
    outputs:
      out_then_mask: ${{ steps.a.outputs.out_then_mask }}
      out_later_mask: ${{ steps.b.outputs.out_later_mask }}
    steps:
      - id: a
        run: |
          VAL="CCC-out-then-mask-333"
          echo "out_then_mask=$VAL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$VAL"
      - id: b
        run: |
          VAL="DDD-out-later-mask-444"
          echo "out_later_mask=$VAL" >> "$GITHUB_OUTPUT"
      - id: c
        run: |
          echo "::add-mask::DDD-out-later-mask-444"
  consumer:
    needs: producer
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -n "${{ needs.producer.outputs.out_then_mask }}" ]; then echo "OUT_THEN_MASK OK"; else echo "OUT_THEN_MASK EMPTY"; fi
          if [ -n "${{ needs.producer.outputs.out_later_mask }}" ]; then echo "OUT_LATER_MASK OK"; else echo "OUT_LATER_MASK EMPTY"; fi
