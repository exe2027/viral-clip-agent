# Encolar + PUBLICAR un clip ya producido en la Cola del panel AVC.
# REAL TEST (2026-11-18): la v3 karaoke 3220 se publica de inmediato
# en las 4 cuentas ES. Si falla una plataforma, el loop es: ver el
# error exacto en el log, corregirlo en el Worker/panel, redeplegar
# y reintentar. NUNCA publicar la version simple como atajo.
#
# GENÉRICO (2026-11-19): un solo workflow para todos los tenants.
# La autenticación es un token de un solo uso del panel (input
# brain_token, requerido): el paso bootstrap lo canjea por una
# sesión de 12 h y los scripts (enqueue_clip.py, publish_clip.py,
# check_jobs.py) la usan vía PANEL_SESSION_TOKEN. Nada de
# `environment: <tenant>` ni PANEL_USERNAME/PASSWORD en GitHub.
# El token se consigue en el panel (donde el usuario ya está
# logueado); sin él el bootstrap falla con mensaje claro.
#
# Flujo (verificado en worker/src/index.ts + gate.ts):
#   1. enqueue_clip.py: POST /api/clips + PUT del MP4 a R2 (no publica).
#   2. publish_clip.py: POST /preview-seen (sin esto el gate frena),
#      POST /publish (publishGate por plataforma: SEO>=90, 40-60 s,
#      GTA VI, topes diarios por plataforma+idioma, espaciamiento 2 h).
#      Las que pasan se encolan como jobs; el Worker (cron */5) las
#      ejecuta y cada 'posted' lleva su evidence_url (link publico).
#   3. Poll de GET /api/jobs hasta posted/failed/draft (max 14 min).
#
# Uso: Actions > Enqueue clip > Run workflow
#   tenant:         tenant del panel (p. ej. sebastian, kaez)
#   brain_token:    token de un solo uso emitido por el panel
#   run_dir:        carpeta del run con manifest.json
#   video_path:     MP4 final con subtitulos quemados (la v3 karaoke)
#   subtitle_style: tiktok | highlight | karaoke (default karaoke)
#
# Nota: se llama a la URL DIRECTA del Worker, NO al front de Pages:
# Pages corta las llamadas API desde Actions (medido 2026-11-18).
# El MP4 y el manifest.json van commiteados con -f porque runs/ esta
# en .gitignore (mismo patron que seg_1080p30.mp4 y subs_karaoke.ass).
name: Enqueue clip

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant del panel (p. ej. sebastian, kaez)"
        required: true
      brain_token:
        description: "Token de un solo uso emitido por el panel (sin él el bootstrap falla)"
        required: true
      run_dir:
        description: "Carpeta del run con manifest.json"
        default: "runs/2932415021-p3220"
      video_path:
        description: "MP4 final con subtitulos quemados"
        default: "runs/2932415021-p3220/clips/clip_01_t53m20s_s14.3_r7h4_rdjavi_subs_C_v3_karaoke.mp4"
      subtitle_style:
        description: "Estilo de subtitulo (tiktok | highlight | karaoke)"
        default: "karaoke"
      clip_id:
        description: "ID del clip ya encolado (solo con skip_enqueue=true)"
        default: ""
      skip_enqueue:
        description: "true = no encolar, publicar el clip_id dado"
        default: "false"
      check_only:
        description: "true = solo leer el estado de los jobs, sin publicar nada"
        default: "false"

jobs:
  enqueue-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PANEL_TENANT: ${{ inputs.tenant }}
      PANEL_BASE_URL: https://avc.vikingosfoodspa.workers.dev
      PANEL_URL: https://avc.vikingosfoodspa.workers.dev
      SUBTITLE_STYLE: ${{ inputs.subtitle_style }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Bootstrap: canjea el token de un solo uso por una sesión
      # de 12 h del tenant (PANEL_SESSION_TOKEN en el entorno del
      # runner, enmascarada). Sin token válido, falla aquí.
      # El token NO va en env: (el runner imprime el bloque env:
      # del paso en el registro y quedaba en claro — mismo fallo
      # que cerebro-live.yml, verificado 2026-11-20). Se lee del
      # archivo del evento, se enmascara y solo vive en este paso.
      - name: Credenciales desde el panel
        run: |
          TOKEN="$(python -c "import json, os; print(json.load(open(os.environ['GITHUB_EVENT_PATH'])).get('inputs', {}).get('brain_token', ''))")"
          test -n "$TOKEN" || { echo "ERROR: sin token del cerebro en los inputs" >&2; exit 1; }
          echo "::add-mask::$TOKEN"
          PANEL_BRAIN_TOKEN="$TOKEN" python -m clipagent.panel_credentials
      - name: Solo verificar jobs (lectura, sin publicar)
        if: ${{ inputs.check_only == 'true' }}
        run: |
          set -euo pipefail
          python3 runs/live/rubius_2026-11-18/check_jobs.py "${{ inputs.clip_id }}"
      - name: Encolar v3 (sin publicar todavia)
        if: ${{ inputs.skip_enqueue != 'true' && inputs.check_only != 'true' }}
        run: |
          set -euo pipefail
          python3 runs/live/rubius_2026-11-18/enqueue_clip.py \
            "${{ inputs.run_dir }}" "${{ inputs.video_path }}" \
            | tee /tmp/enqueue.log
          grep -oP 'CLIP CREADO EN LA COLA: id = \K[0-9]+' /tmp/enqueue.log \
            > /tmp/clip_id.txt
          echo "CLIP_ID=$(cat /tmp/clip_id.txt)"
      - name: Publicar en las 4 cuentas + verificar
        if: ${{ inputs.check_only != 'true' }}
        run: |
          set -euo pipefail
          ID="${{ inputs.clip_id }}"
          if [ -z "$ID" ]; then ID="$(cat /tmp/clip_id.txt)"; fi
          echo "Publicando clip $ID"
          python3 runs/live/rubius_2026-11-18/publish_clip.py \
            "$ID" --wait-min=14
