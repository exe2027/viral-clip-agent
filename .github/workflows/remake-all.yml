# Re-hacer a rubius los clips bloqueados (batch, 2026-11-20)
#
# Corre `python -m clipagent.remake_all --from-panel`: toma los
# clips con publish_blocked=1 de la Cola del panel y por cada uno
# ejecuta el ciclo completo: descarga su segmento del VOD de
# Twitch -> transcribe -> render rubius -> valida el vídeo final
# (plantilla rubius) -> si pasa, sube el vídeo corregido
# (PUT /api/clips/:id/video, que además resetea preview_seen a 0
# en el panel) y desbloquea el clip (publish_blocked=0). Si la
# validación falla, re-renderiza con la otra estrategia de caja
# de cámara hasta --max-intentos; si sigue fallando, el clip
# queda para revisión humana. Sin source_id (109 de los 118
# bloqueados, 2026-11-20: los clips en vivo no registraron el
# VOD) el clip queda como sin_vod / avisar-humano y el batch
# sigue. Un clip que falla nunca tumba el batch: todo queda en
# el JSON runs/remake-all-<tenant>-<fecha>.json (artefacto).
#
# Clips PUBLICADOS que pasan: el vídeo del panel se reemplaza
# pero el clip NO se desbloquea (desbloquearlo haría que el
# auto-publicador lo volviera a publicar y duplicaría las
# copias). Las copias publicadas se borran y se republican a
# mano (TikTok no tiene API de borrado).
#
# Disparadores (como cerebro-live y validate-all: sin cron, un
# run por cron no tendría token para autenticarse):
# - repository_dispatch panel-remake-all (lo dispara el panel /
#   el Worker con un token de un solo uso en client_payload,
#   igual que panel-live y panel-validate-all; el tenant va en
#   client_payload). El Worker todavía NO sabe disparar
#   panel-remake-all (falta el cambio en el panel, parte del
#   release): hasta que exista, se dispara con workflow_dispatch.
# - workflow_dispatch manual (tenant obligatorio). Sin token de
#   un solo uso el bootstrap usa el login de servicio del
#   entorno `sebastian` (secretos PANEL_USERNAME/PANEL_PASSWORD,
#   como cerebro-sebastian.yml): el canje del panel no es la
#   única vía — PanelBridge cae al login cuando no hay
#   PANEL_BRAIN_TOKEN (panel_bridge.py: from_env). No hay
#   secreto PANEL_BRAIN_TOKEN en el repo
#   (total_count 0, 2026-11-19): el diseño genérico no mete
#   secretos por tenant en GitHub.
#
# Concurrencia por tenant: dos re-hechos del MISMO tenant nunca
# van en paralelo (cancel-in-progress: false, encolan).
# Timeout 360 min: ~118 clips en serie (descarga + Whisper +
# detección de cara + render rubius + validación + subida)
# tardan horas; el límite de GitHub por job es 360. Por eso el
# batch se corre POR TROZOS con los inputs ids/limit (varias
# corridas hasta completar la lista). Paralelización por matriz
# (propuesta, no impuesta): un job bootstrap que canjea el token
# de un solo uso y guarda la sesión en un artefacto (mismo
# transporte que cerebro-live), y N jobs de matriz que descargan
# ese artefacto y procesan su trozo con --ids. No se impone
# aquí: el token de un solo uso solo se canjea una vez y la
# sesión compartida entre jobs de matriz necesita que el
# artefacto no se borre entre medias.
name: Re-hacer a rubius los clips bloqueados

on:
  repository_dispatch:
    types: [panel-remake-all]
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant del panel (p. ej. sebastian, kaez)"
        required: true
      ids:
        description: "Solo estos ids de clip, separados por comas (vacío = todos los bloqueados)"
        required: false
        default: ""
      limit:
        description: "Máximo de clips a re-hacer (vacío = todos; usa trozos, 360 min por corrida)"
        required: false
        default: ""
      max_intentos:
        description: "Intentos de render por clip (default 3)"
        required: false
        default: "3"

concurrency:
  group: remake-all-${{ github.event.client_payload.tenant || inputs.tenant }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remake:
    name: Re-hacer a rubius los clips bloqueados
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Entorno `sebastian`: sus secretos PANEL_USERNAME /
    # PANEL_PASSWORD alimentan el bootstrap cuando el dispatch
    # no trae token de un solo uso (workflow_dispatch manual).
    environment: sebastian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache de pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "pip-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}"
          restore-keys: |
            pip-${{ runner.os }}-py312-
      - name: Instalar ffmpeg, TwitchDownloaderCLI y dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # TwitchDownloaderCLI 1.56.5: baja [start, end] del VOD
          # (auto_clips.download_twitch_segment). Mismo bloque que
          # el job vod-fallback de cerebro-live.yml.
          TDL_VERSION="1.56.5"
          curl -sSL -o /tmp/twitchdownloader.zip \
            "https://github.com/lay295/TwitchDownloader/releases/download/${TDL_VERSION}/TwitchDownloaderCLI-${TDL_VERSION}-Linux-x64.zip"
          sudo unzip -o -q /tmp/twitchdownloader.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/TwitchDownloaderCLI
          TwitchDownloaderCLI --help || true
          # whisper: transcripción local (faster-whisper).
          # vision: YuNet + plantilla del validador final.
          python -m pip install -q -e ".[whisper,vision]"
          # Arial Black GENUINA (plantilla rubius, 2026-11-19): el
          # banner del título y los subtítulos usan Arial Black.
          # Mismo bloque que cerebro-live.yml y validate-all.yml
          # (WOFF cdnfonts -> TTF con fontTools). La conversión
          # corre con `python` (nunca `python3`) y SIN `|| true`:
          # si el WOFF se descargó y la conversión falla, el paso
          # falla con mensaje claro. El `|| true` queda SOLO en
          # el curl de descarga.
          if ! fc-list | grep -qi "Arial Black"; then
            mkdir -p ~/.fonts
            curl -fsSL -o ~/.fonts/ariblk.woff \
              "https://fonts.cdnfonts.com/s/97850/ariblk%201.woff" || true
            test -s "$HOME/.fonts/ariblk.woff" || { echo "ERROR: no se descargo ~/.fonts/ariblk.woff (curl fallo)" >&2; exit 1; }
            python -c "from fontTools.ttLib import TTFont; f=TTFont('$HOME/.fonts/ariblk.woff'); f.flavor=None; f.save('$HOME/.fonts/arial-black.ttf')"
            test -s "$HOME/.fonts/arial-black.ttf" || { echo "ERROR: fontTools no genero ~/.fonts/arial-black.ttf" >&2; exit 1; }
            fc-cache -f >/dev/null 2>&1 || true
          fi
          fc-list | grep -i "Arial Black" | head -2 || echo "sin Arial Black (libass usara fallback)"
      # Bootstrap: credenciales del tenant desde el panel. Canjea
      # el token de un solo uso del dispatch por una sesión de 12 h
      # (PANEL_SESSION_TOKEN en $GITHUB_ENV, la usa el batch para
      # leer la Cola, subir los vídeos y desbloquear) y materializa
      # Gemini en el entorno (la capa Gemini del validador). Sin
      # token falla con mensaje claro: dispara desde el panel.
      - name: Credenciales desde el panel
        id: bootstrap
        env:
          PANEL_TENANT: ${{ github.event.client_payload.tenant || inputs.tenant }}
          PANEL_BRAIN_TOKEN: ${{ github.event.client_payload.brain_token }}
          # Fallback workflow_dispatch: login de servicio del
          # entorno `sebastian` (sin token de un solo uso el
          # bootstrap canjea con estas; ver panel_bridge.from_env).
          PANEL_USERNAME: ${{ secrets.PANEL_USERNAME }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: python -m clipagent.panel_credentials
      - name: Re-hacer a rubius los clips bloqueados
        env:
          # URL DIRECTA del Worker, NO el front de Pages: Pages
          # corta las llamadas API desde Actions (medido
          # 2026-11-18 en cerebro-live).
          PANEL_URL: https://avc.vikingosfoodspa.workers.dev
          PANEL_WORKER_URL: https://avc.vikingosfoodspa.workers.dev
        run: |
          ARGS="--from-panel"
          if [ -n "${{ inputs.ids }}" ]; then ARGS="$ARGS --ids ${{ inputs.ids }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.max_intentos }}" ]; then ARGS="$ARGS --max-intentos ${{ inputs.max_intentos }}"; fi
          python -m clipagent.remake_all $ARGS
      - name: Subir el JSON de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remake-all-${{ github.event.client_payload.tenant || inputs.tenant }}
          path: runs/remake-all-*.json
          if-no-files-found: error
