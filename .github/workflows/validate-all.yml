# Validar todos los clips (batch del validador final, 2026-11-19)
#
# Corre `python -m clipagent.validate_all --from-panel`: descarga
# el VÍDEO FINAL de cada clip de la Cola (Cola + publicados) por
# GET /api/clips/:id/video (sesión del panel), lo valida con el
# validador final (cara YuNet + plantilla + Gemini) y deja la
# lista de trabajo para el batch de re-hacer a rubius en un JSON
# (runs/validate-all-<tenant>-<fecha>.json, subido como artefacto):
# pasa / falla (re-render si está en Cola, re-make-replace si
# está publicado) / pendiente (Gemini no disponible, reintentar)
# / error (sin vídeo, avisar-humano). El batch NO re-renderiza,
# NO publica y NO borra nada: solo clasifica.
#
# Disparadores (como cerebro-live: sin cron, un run por cron no
# tendría token para autenticarse):
# - repository_dispatch panel-validate-all (lo dispara el panel /
#   el Worker con un token de un solo uso en client_payload, igual
#   que panel-live; el tenant va en client_payload).
# - workflow_dispatch manual (tenant obligatorio). Sin token de un
#   solo uso el bootstrap falla con mensaje claro: dispara desde
#   el panel. No hay secreto PANEL_BRAIN_TOKEN en el repo
#   (total_count 0, 2026-11-19): el diseño genérico no mete
#   secretos por tenant en GitHub.
#
# Concurrencia por tenant: dos validaciones del MISMO tenant
# nunca van en paralelo (cancel-in-progress: false, encolan).
# Timeout 360 min: 121 clips en serie (descarga + YuNet + 1
# llamada Gemini por clip) tardan horas; el límite de GitHub por
# job es 360. Para validar por trozos, usa los inputs ids/limit.
name: Validar todos los clips (batch)

on:
  repository_dispatch:
    types: [panel-validate-all]
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant del panel (p. ej. sebastian, kaez)"
        required: true
      ids:
        description: "Solo estos ids de clip, separados por comas (vacío = todos)"
        required: false
        default: ""
      limit:
        description: "Máximo de clips a validar (vacío = todos)"
        required: false
        default: ""

concurrency:
  group: validate-all-${{ github.event.client_payload.tenant || inputs.tenant }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validar todos los clips
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache de pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "pip-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}"
          restore-keys: |
            pip-${{ runner.os }}-py312-
      - name: Instalar ffmpeg y dependencias de visión
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q -e ".[vision]"
          # Arial Black GENUINA (plantilla v2, 2026-11-18): la
          # puerta de plantilla verifica la fuente en píxeles
          # (fuente_ariblk). Sin ella libass cae a otra fuente y
          # el chequeo falla aunque el montaje esté bien. Mismo
          # bloque que cerebro-live.yml (WOFF cdnfonts -> TTF con
          # fontTools). La conversión corre con `python` (nunca
          # `python3`) y SIN `|| true`: si el WOFF se descargó y
          # la conversión falla, el paso falla con mensaje claro.
          # El `|| true` queda SOLO en el curl de descarga.
          if ! fc-list | grep -qi "Arial Black"; then
            mkdir -p ~/.fonts
            curl -fsSL -o ~/.fonts/ariblk.woff \
              "https://fonts.cdnfonts.com/s/97850/ariblk%201.woff" || true
            test -s "$HOME/.fonts/ariblk.woff" || { echo "ERROR: no se descargo ~/.fonts/ariblk.woff (curl fallo)" >&2; exit 1; }
            python -c "from fontTools.ttLib import TTFont; f=TTFont('$HOME/.fonts/ariblk.woff'); f.flavor=None; f.save('$HOME/.fonts/arial-black.ttf')"
            test -s "$HOME/.fonts/arial-black.ttf" || { echo "ERROR: fontTools no genero ~/.fonts/arial-black.ttf" >&2; exit 1; }
            fc-cache -f >/dev/null 2>&1 || true
          fi
          fc-list | grep -i "Arial Black" | head -2 || echo "sin Arial Black (libass usara fallback)"
      # Bootstrap: credenciales del tenant desde el panel. Canjea
      # el token de un solo uso del dispatch por una sesión de 12 h
      # (PANEL_SESSION_TOKEN en $GITHUB_ENV, la usa el batch para
      # descargar los vídeos por GET /api/clips/:id/video) y
      # materializa Gemini en el entorno (la capa Gemini del
      # validador). Sin token falla con mensaje claro: dispara
      # desde el panel.
      - name: Credenciales desde el panel
        id: bootstrap
        env:
          PANEL_TENANT: ${{ github.event.client_payload.tenant || inputs.tenant }}
          PANEL_BRAIN_TOKEN: ${{ github.event.client_payload.brain_token }}
        run: python -m clipagent.panel_credentials
      - name: Validar todos los clips (batch)
        env:
          # URL DIRECTA del Worker, NO el front de Pages: Pages
          # corta las llamadas API desde Actions (medido
          # 2026-11-18 en cerebro-live).
          PANEL_URL: https://avc.vikingosfoodspa.workers.dev
        run: |
          ARGS="--from-panel"
          if [ -n "${{ inputs.ids }}" ]; then ARGS="$ARGS --ids ${{ inputs.ids }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m clipagent.validate_all $ARGS
      - name: Subir el JSON de trabajo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-all-${{ github.event.client_payload.tenant || inputs.tenant }}
          path: runs/validate-all-*.json
          if-no-files-found: error
