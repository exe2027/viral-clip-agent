name: Cerebro — Sebastián

# VÍA PRINCIPAL (decisión del usuario 17 nov 2026: "Todo automático").
# Cloudflare (panel/API/cola) + GitHub Actions como compute principal
# $0: el cerebro Python (ffmpeg/Whisper) corre aquí, sin VPS ni PC
# prendida, dentro de los 2.000 min/mes gratis (repo privado). La
# lentitud no importa: el trabajo es programado (cron 09:00). Solo
# Cloudflare + manual queda como respaldo degradado (ver
# docs/plan-cloudflare-solo.md). Plan principal completo:
# docs/plan-principal.md.
# Cerebro (viral-clip-agent) del panel de Sebastián. Una instalación por
# persona (plan §3): este workflow SOLO toca el Environment `sebastian`
# y su estado; el del colega vive en cerebro-colega.yml. Sin matriz.
# El agente navegador TikTok NO corre aquí: necesita sesión persistente
# en disco local, misma IP y un humano para el captcha (corre en el
# runner autoalojado de su PC).
#
# EXPERIENCIA (especificación del usuario): login → configurar cuentas /
# subtítulos / ajustes → botón Iniciar en el Worker → 100% automatizado,
# sin pasos manuales después. El usuario NO toca GitHub Actions, ni
# terminal, ni instala nada después de Iniciar.
# Cómo se cumple: el botón Iniciar del panel dispara este workflow con
# un repository_dispatch (el Worker del panel llama a la API de GitHub
# con un token guardado como secreto del Worker, nunca en el repo).
# Solo repository_dispatch lee/escribe state/panel-state.json:
# panel-start-sebastian pone started=true y panel-stop-sebastian lo
# quita. Un workflow_dispatch manual y el cron trabajan directamente
# (un dispatch manual es una orden de trabajar) y NUNCA reescriben el
# estado del panel, así que un run que no trabaja no puede apagarlo
# subiendo un panel-state.json con started=false (auditoría 19 nov
# 2026, C1/C3). El input `force` del dispatch manual permite respetar
# el estado del panel con force=false.
# La instalación (Playwright/Chromium, sesión TikTok) es parte única
# de "configurar cuentas", ANTES de Iniciar; después no hay terminal.

on:
  # 09:00 America/Santiago en horario de verano chileno (UTC-3, nov-mar).
  # En invierno (UTC-4, abr-sep) corre a las 08:00 locales; si se quiere
  # 09:00 exacto todo el año, cambiar a '0 13 * * *' en abril y volver
  # a '0 12 * * *' en septiembre.
  schedule:
    - cron: "0 12 * * *"
  repository_dispatch:
    types: [panel-start-sebastian, panel-stop-sebastian]
  workflow_dispatch:
    inputs:
      force:
        description: "Trabajar aunque el panel esté detenido (true: orden de trabajar; false: respetar state/panel-state.json)"
        required: false
        default: "true"
        type: boolean
      streamer:
        description: "Solo este streamer (p. ej. rubius, para rescates); vacío = todos los vigilados"
        required: false
        default: ""
        type: string

concurrency:
  group: cerebro-sebastian
  cancel-in-progress: false

permissions:
  contents: read
  # C2: el paso "Resolver run previo exitoso" lista runs del workflow
  # con `gh api` usando GITHUB_TOKEN.
  actions: read

jobs:
  vod-check-and-publish:
    runs-on: ubuntu-latest
    environment: sebastian
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      CLIP_PUBLIC_BASE_URL: ${{ secrets.CLIP_PUBLIC_BASE_URL }}
      PANEL_TENANT: sebastian
      # C8: el worker sube los clips terminados a la Cola del panel
      # con PanelBridge; sin estas dos el puente devuelve None y
      # los clips quedan solo en el runner. Ambos secretos ya
      # existen en el entorno `sebastian` (solo faltaba mapearlos).
      PANEL_USERNAME: ${{ secrets.PANEL_USERNAME }}
      PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
      # Zernio (TikTok por agregador, draft-first): la clave y la
      # cuenta existen como secretos del entorno `sebastian`
      # (ZERNIO_API_KEY, ZERNIO_TIKTOK_ACCOUNT_ID). Sin ellas,
      # ZernioAdapter cae a draft con el motivo.
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      # TwitchDownloaderCLI (solo Twitch: chat + segmento de vídeo).
      # Sin él auto_clips falla en VODs de Twitch ("no está en el
      # PATH"). Versión fijada: la misma del plan (1.56.5). El zip
      # Linux es autocontenido (no exige instalar .NET). Si este
      # paso falla, el fallo es visible aquí, no en silencio dentro
      # del worker.
      - name: Instalar TwitchDownloaderCLI
        run: |
          TDL_VERSION="1.56.5"
          curl -sSL -o /tmp/twitchdownloader.zip \
            "https://github.com/lay295/TwitchDownloader/releases/download/${TDL_VERSION}/TwitchDownloaderCLI-${TDL_VERSION}-Linux-x64.zip"
          sudo unzip -o -q /tmp/twitchdownloader.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/TwitchDownloaderCLI
          # --help sale con exit 1 en esta versión; no debe tumbar el
          # paso (bash -e) aunque el binario esté bien instalado.
          TwitchDownloaderCLI --help || true

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,youtube,whisper]

      - name: Ruff
        run: ruff check .

      # Puerta rápida antes de procesar: si el cerebro está roto, no
      # se toca la cola. La suite completa corre en CI (ci.yml).
      - name: Tests de humo
        run: pytest -q test_smoke.py test_tiktok_browser.py test_policy.py

      # Estado persistente entre días: el runner es efímero y queue.db /
      # seen_vods.json / publish_queue.json están gitignored. Se
      # restauran del artefacto del día anterior y se vuelven a subir
      # al final. (Migración pendiente a D1, plan §6.4.)
      # C2: download-artifact sin run-id busca el artefacto en el run
      # en curso y siempre falla. Se resuelve el último run exitoso
      # de este workflow (el run actual aún no es exitoso, así que el
      # primero de la lista es siempre un run anterior). Sin run
      # previo exitoso, o si la API falla, se sigue sin estado: el
      # workflow no falla por esto.
      - name: Resolver run previo exitoso
        id: prev-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/cerebro-sebastian.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty' || true)"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          if [ -n "$RUN_ID" ]; then
            echo "Último run exitoso: ${RUN_ID}"
          else
            echo "Sin run previo exitoso: se arranca sin estado restaurado."
          fi

      # C2: download-artifact@v4 con run-id falló SIEMPRE en este
      # repo ("Artifact not found") aunque el artefacto existe y es
      # listable por API (verificado en los runs 44474668621 y
      # 44476907092: `gh run download` lo baja sin problema). Se
      # restaura con `gh run download`, misma API REST, y se lista
      # lo restaurado en el log para que un fallo no sea silencioso.
      - name: Restaurar estado del día anterior
        if: steps.prev-run.outputs.run_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.prev-run.outputs.run_id }}" \
            -n cerebro-state-sebastian -D . \
            --repo "${GITHUB_REPOSITORY}" || exit 0
          echo "Estado restaurado:"
          ls -la queue.db seen_vods.json publish_queue.json \
            state/panel-state.json 2>/dev/null || true

      # Puerta Iniciar (C1/C3): SOLO repository_dispatch toca
      # state/panel-state.json (panel-start lo pone en true,
      # panel-stop en false). Un workflow_dispatch manual y el cron
      # trabajan directamente — un dispatch manual es una orden de
      # trabajar — y nunca reescriben el estado del panel, así que
      # "Guardar estado" jamás sube un panel-state.json con
      # started=false generado por un run que no trabajó (sube, como
      # mucho, el valor restaurado del run anterior, sin tocarlo).
      # Solo con force=false el dispatch manual respeta el estado
      # del panel. Nunca un paro silencioso: queda en el log.
      - name: Puerta Iniciar (botón del panel)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_TYPE: ${{ github.event.action }}
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'EOF'
          import json, os
          state_path = "state/panel-state.json"
          event = os.environ.get("EVENT")
          action = os.environ.get("DISPATCH_TYPE")
          force_raw = os.environ.get("FORCE", "")


          def _force():
              # workflow_dispatch con type:boolean entrega
              # "true"/"false"; schedule y repository_dispatch no
              # tienen inputs -> "" se trata como True (trabajar).
              return force_raw.strip().lower() not in ("false", "0", "no")


          def _read_started():
              try:
                  with open(state_path) as f:
                      return bool(json.load(f).get("started", False))
              except (OSError, ValueError):
                  return False


          started = False
          persist = False
          if event == "repository_dispatch" \
                  and action == "panel-start-sebastian":
              started, persist = True, True
          elif event == "repository_dispatch" \
                  and action == "panel-stop-sebastian":
              started, persist = False, True
          elif event == "workflow_dispatch":
              started = True if _force() else _read_started()
          elif event == "schedule":
              started = True

          if persist:
              os.makedirs("state", exist_ok=True)
              with open(state_path, "w") as f:
                  json.dump({"started": started}, f)
          print(f"Panel iniciado: {started} "
                f"(evento={event} acción={action} "
                f"force={force_raw!r} estado_persistido={persist})")
          if not started:
              print("Panel no iniciado: esperando el botón Iniciar; "
                    "sin procesar nada.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"started={'true' if started else 'false'}\n")
              out.write("persist_panel_state="
                        f"{'true' if persist else 'false'}\n")
          EOF

      - name: Credenciales YouTube (solo si existen los secretos)
        if: steps.gate.outputs.started == 'true'
        env:
          YT_CLIENT_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON_B64 }}
          YT_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
        run: |
          if [ -n "$YT_CLIENT_B64" ]; then
            echo "$YT_CLIENT_B64" | base64 -d > client_secrets.json
          fi
          if [ -n "$YT_TOKEN_B64" ]; then
            echo "$YT_TOKEN_B64" | base64 -d > token.json
          fi

      # Revisión diaria de VODs nuevos (09:00 America/Santiago).
      # --live es obligatorio (C6): sin él watch es dry-run y jamás
      # encola nada (watcher.py: dry_run = not args.live).
      # Observabilidad (C9): el resumen que imprime watch
      # ("Resumen: ... encolados=N | ... | errores=M", watcher.py)
      # se parsea a salidas del job y al resumen del paso; el run
      # falla con mensaje claro solo si encolados==0 y errores>0.
      # Un watch con errores pero algún encolado avisa y sigue: un
      # influencer roto no tumba la pasada (el exit 2 propio de
      # watch se absorbe y se re-decide desde el resumen).
      - name: Revisión de VODs
        id: watch
        if: steps.gate.outputs.started == 'true'
        run: |
          set +e
          # Rescate dirigido (input streamer del workflow_dispatch,
          # p. ej. rubius): solo ese streamer. Vacío = todos.
          WATCH_ARGS="--once --live"
          if [ -n "${{ inputs.streamer }}" ]; then
            WATCH_ARGS="$WATCH_ARGS --streamer ${{ inputs.streamer }}"
          fi
          # shellcheck disable=SC2086
          python -m clipagent watch $WATCH_ARGS 2>&1 | tee watch.log
          WATCH_EXIT="${PIPESTATUS[0]}"
          set -e
          WATCH_EXIT="$WATCH_EXIT" python - <<'PYEOF'
          import os
          import re
          import sys

          SUMMARY_RE = re.compile(
              r"Resumen: en vivo=(?P<live>\d+)"
              r" \| VODs revisados=(?P<new_vods>\d+)"
              r" \| encolados=(?P<enqueued>\d+)"
              r" \| encolar[ií]an? \(dry-run\)=(?P<would_enqueue>\d+)"
              r" \| descartados=(?P<skipped>\d+)"
              r" \| ya vistos=(?P<seen>\d+)"
              r" \| errores=(?P<errors>\d+)"
          )
          KEYS = ("live", "new_vods", "enqueued", "would_enqueue",
                  "skipped", "seen", "errors")
          LABELS = (("En vivo", "live"), ("VODs revisados", "new_vods"),
                    ("Encolados", "enqueued"),
                    ("Encolarían (dry-run)", "would_enqueue"),
                    ("Descartados", "skipped"), ("Ya vistos", "seen"),
                    ("Errores", "errors"))

          watch_exit = int(os.environ.get("WATCH_EXIT", "0"))
          summary = None
          try:
              with open("watch.log", encoding="utf-8",
                        errors="replace") as f:
                  for line in f:
                      match = SUMMARY_RE.search(line)
                      if match:
                          summary = {k: int(v) for k, v in
                                     match.groupdict().items()}
          except OSError as exc:
              print(f"No se pudo leer watch.log: {exc}")


          def _emit(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"{name}={value}\n")


          if summary is None:
              _emit("enqueued", 0)
              _emit("errors", 1 if watch_exit else 0)
              _emit("watch_exit", watch_exit)
              if watch_exit != 0:
                  print(f"::error::watch terminó con exit {watch_exit} "
                        "y no emitió la línea 'Resumen:' (watcher.py); "
                        "no se puede saber cuántos VODs se encolaron.")
                  sys.exit(1)
              print("::warning::watch no emitió la línea 'Resumen:' "
                    "(p. ej. lista de influencers vacía); se sigue "
                    "sin contadores.")
              sys.exit(0)

          for key in KEYS:
              _emit(key, summary[key])
          _emit("watch_exit", watch_exit)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## Revisión de VODs (watch --live)\n\n")
              s.write("| Métrica | Valor |\n|---|---:|\n")
              for label, key in LABELS:
                  s.write(f"| {label} | {summary[key]} |\n")
              s.write(f"\nExit de watch: `{watch_exit}`\n")

          print(f"Watch: encolados={summary['enqueued']} "
                f"descartados={summary['skipped']} "
                f"errores={summary['errors']} (exit {watch_exit})")
          if summary["enqueued"] == 0 and summary["errors"] > 0:
              print("::error::watch no encoló ningún VOD y tuvo "
                    f"{summary['errors']} error(es); revisa watch.log.")
              sys.exit(1)
          if summary["errors"] > 0:
              print(f"::warning::watch tuvo {summary['errors']} "
                    "error(es) pero encoló "
                    f"{summary['enqueued']} VOD(s); se sigue.")
          PYEOF

      # Cadena completa en una pasada (tras pulsar Iniciar no hay
      # pasos manuales): el worker monolítico corre auto_clips
      # (detección de picos por chat → corte 9:16 con ffmpeg →
      # subtítulos faster-whisper → empaquetado SEO) y sube los
      # clips a la Cola del panel (C8: create_clip + upload_video,
      # solo para aprobación, NUNCA publica).
      # PUBLICADOR ÚNICO (P0 #8, #64, 2026-11-21): el cerebro NO
      # publica. El publish loop --live está RETIRADO de este
      # workflow: publicaba los mismos clips por adapters directos
      # de Python y duplicaba con el Worker. El único publicador
      # es el Worker: su ciclo auto-encola los clips aprobados de
      # la Cola (autoEnqueueTopClips) y publica por sus adapters
      # (YouTube/TikTok/IG/FB) con todos los gates (franja,
      # espaciamiento, tope diario, calentamiento, 1 por slot).
      # La auditoría después refleja el estado de las cuentas.
      # El agente navegador TikTok NO corre aquí (sesión
      # persistente, misma IP y captcha humano: runner autoalojado
      # en su PC): sus clips quedan en draft hasta que los publica
      # el agente o se suben a mano.
      - name: Cadena completa (detectar, cortar, subtitular, publicar)
        if: steps.gate.outputs.started == 'true'
        run: |
          python -m clipagent worker --once --top-n 5
          python -m clipagent publish audit
          python -m clipagent status

      # Si algo se atasca: queda registrado con motivo y hora en
      # state/run-log.jsonl (artefacto cerebro-logs-sebastian), no
      # parado en silencio. El panel debe mostrar ese registro.
      - name: Registrar atasco (motivo + hora, visible)
        if: failure()
        run: |
          python - <<'EOF'
          import json, os
          from datetime import datetime, timezone
          os.makedirs("state", exist_ok=True)
          entry = {
              "at": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "job": "vod-check-and-publish",
              "panel": "sebastian",
              "conclusion": "failure",
          }
          with open("state/run-log.jsonl", "a") as f:
              f.write(json.dumps(entry, ensure_ascii=False) + "\n")
          print(json.dumps(entry, ensure_ascii=False))
          EOF

      - name: Subir registro de atascos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-logs-sebastian
          path: state/run-log.jsonl
          if-no-files-found: ignore
          retention-days: 90

      # C1/C3: state/panel-state.json solo lo reescribe la puerta en
      # repository_dispatch; un run manual o de cron lo re-sube, como
      # mucho, con el valor restaurado del run anterior, sin tocarlo.
      # Nunca se sube un started=false generado por un run que no
      # trabajó.
      # SEGURIDAD (2026-11-20): state/tiktok_browser.json (sesión de
      # navegador TikTok en claro) NUNCA se sube a artefactos: el
      # repo es público y la sesión quedaría descargable por
      # cualquiera. Tampoco se restaura de artefactos viejos.
      - name: Guardar estado para mañana
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-state-sebastian
          path: |
            queue.db
            seen_vods.json
            publish_queue.json
            state/panel-state.json
            state/counter.json
          if-no-files-found: ignore
          retention-days: 30
