# Cerebro — Live Cutter (monitoreo en vivo simultáneo)
#
# FALLO REAL 2026-11-18: el monitoreo en vivo simultáneo NO se
# estaba haciendo. Causas (las 3 confirmadas):
# 1. cerebro-sebastian corre 1 vez al día (09:00) + un dispatch
#    al pulsar Iniciar (una corrida de ~13 min y termina).
# 2. cerebro-live corría cada 30 min pero solo para rubius por
#    defecto, 25 min por corrida, y solo Twitch (sin Kick).
# 3. cerebro-live NO declaraba `environment: sebastian`, así que
#    TWITCH_CLIENT_ID/SECRET y PANEL_USERNAME/PASSWORD se
#    resolvían vacíos (los secretos viven en el entorno
#    sebastian, no a nivel de repo): sin PANEL_* el cutter
#    encola solo en el cerebro y NADA llega al panel.
#    Además PANEL_USERNAME/PANEL_PASSWORD ni existían como
#    secretos: se crearon con el login de servicio del panel.
#
# MEDIDO 2026-11-18 19:31-19:40Z: la corrida 44381513042 (detect
# OK, 6 streamers en vivo en GTA VI) fue CANCELADA a los ~9 min
# por el siguiente trigger, porque `cancel-in-progress: true` y
# una corrida dura ~11-13 min (setup + sesión 8 min) con
# triggers cada 10 min: con cancelación, NINGUNA corrida termina
# nunca. Por eso el ciclo es */15 con sesiones de 10 min
# (~13,5 min por corrida < 15 min) y `cancel-in-progress: false`
# (las corridas encolan, nunca se cancelan entre sí: hay DOS
# fuentes de triggers — cron + dispatch panel-live del Worker —
# y la cancelación mataría cualquier corrida en curso). El Worker
# además NO dispara si ya hay una corrida en curso/en cola
# (throttle 15 min por tenant).
#
# Diseño actual (2026-11-18):
# - cron */15: barrido de TODOS los enabled de streamers.yaml
#   (ES + EN, Twitch y Kick) en cada ciclo. El Worker cron */5
#   dispara además `panel-live-<tenant>` mientras running=1
#   (throttle 15 min por tenant en D1), así el monitoreo sigue
#   aunque el usuario cierre sesión.
# - job `detect` (~1 min): clipagent.live_scan lee en vivo +
#   categoría GTA VI por API oficial (Helix / Kick API v2).
#   YouTube no tiene watcher en vivo todavía: se salta con nota.
# - job `cut` (matrix, un job por streamer en vivo, max 4 en
#   paralelo): `python -m clipagent live <name> --cut --minutes 10`.
#   Cada sesión re-verifica vivo + GTA VI (CategoryGate), aplica
#   la puerta pre-render + revisión de los mejores picos
#   (clipagent.review) y encola en la Cola LIVE del panel vía
#   PanelBridge. Sin publicar en público todavía (orden
#   2026-11-18 14:37): quedan en draft.
# - job `vod-fallback` (2026-11-19, corrección del usuario: el
#   corte de VOD lo hace el CEREBRO, nunca un agente manual): si
#   ningún ES está en vivo en GTA VI (es_count == 0), cambia solo
#   a modo VOD y corta de los VOD más recientes (Rubius primero,
#   después IlloJuan) con los mismos filtros (viralidad >= 50,
#   SEO >= 90, 40-60 s, subtítulos completos). Máx. 2 VODs y 2
#   clips por corrida, 6 h de enfriamiento por VOD (estado en el
#   artefacto cerebro-live-vod-state, bajado con gh desde la
#   última corrida completada: download-artifact sin run-id solo
#   busca en la corrida actual y el restore venía vacío). Los
#   clips van a la Cola del panel con el MP4 (origin='vod'), SIN
#   publicar. Nunca baja el VOD entero (solo el segmento del
#   pico, vía auto_clips.py).
# - Fase en vivo (2026-11-19, corrección del usuario: el panel
#   tiene que mostrar qué hace el cerebro AHORA, no solo un piloto
#   verde/rojo): detect reporta buscando_picos / sin_directos, cut
#   reporta cortando_clip y el fallback modo_vod (y sin_directos
#   al terminar), todo a POST /api/worker/phase. La fase nunca
#   tumba una corrida: si el panel no responde, solo queda en el
#   log. ATASCADO lo decide solo el validador del Worker.
# - cerebro-sebastian (VOD, 09:00) NO se toca: es el barrido
#   diario de VODs, no el monitoreo en vivo.
name: Cerebro — Live Cutter

on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [panel-live-sebastian, panel-live-colega]
  workflow_dispatch:
    inputs:
      streamers:
        description: "Canales a vigilar, separados por comas (vacío = todos los enabled de streamers.yaml)"
        required: false
        default: ""
      minutes:
        description: "Minutos de sesión por streamer en vivo"
        required: false
        default: "10"
      force:
        description: "Reprocesar VODs intentados hace <6 h (ignora el enfriamiento; solo para reintentos tras un arreglo)"
        required: false
        default: "false"

concurrency:
  group: cerebro-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detectar en vivo en GTA VI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sebastian
    outputs:
      live: ${{ steps.scan.outputs.live }}
      count: ${{ steps.scan.outputs.count }}
      es_count: ${{ steps.scan.outputs.es_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -q -e .
      - name: Barrido simultáneo (todos los enabled, ES + EN)
        id: scan
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          STREAMERS: ${{ inputs.streamers || '' }}
          # Fase en vivo (2026-11-19): el barrido reporta al panel
          # buscando_picos (hay ES en vivo) o sin_directos (nadie
          # ES en GTA VI); el job cut reporta cortando_clip y el
          # fallback modo_vod. Sin estas credenciales el barrido
          # sigue igual, solo no reporta la fase.
          PANEL_TENANT: sebastian
          PANEL_USERNAME: ${{ secrets.PANEL_USERNAME }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          PANEL_URL: https://avc.vikingosfoodspa.workers.dev
        run: python -m clipagent.live_scan

  cut:
    name: Cortar en vivo (${{ matrix.target.name }})
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sebastian
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJson(needs.detect.outputs.live) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache de pip (sin caché, torch/whisper tarda hasta ~28 min)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "pip-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}"
          restore-keys: |
            pip-${{ runner.os }}-py312-
      - name: Instalar ffmpeg, streamlink y whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg streamlink python3-fonttools
          python -m pip install -q -e ".[whisper]"
          # Arial Black GENUINA (plantilla v2, 2026-11-18): título y
          # subtítulos usan SUBS_FONT = "Arial Black". Sin ella
          # libass cae a otra fuente: los subtítulos salen en la
          # fuente equivocada y el título (al cablearlo) se
          # desborda sobre el gameplay (medido en CI 2026-11-19:
          # 2311 px blancos bajo la franja). Mismo bloque que
          # render-rdjavi.yml (WOFF cdnfonts -> TTF con fontTools).
          if ! fc-list | grep -qi "Arial Black"; then
            mkdir -p ~/.fonts
            curl -fsSL -o ~/.fonts/ariblk.woff \
              "https://fonts.cdnfonts.com/s/97850/ariblk%201.woff" || true
            python3 -c "from fontTools.ttLib import TTFont; f=TTFont('$HOME/.fonts/ariblk.woff'); f.flavor=None; f.save('$HOME/.fonts/arial-black.ttf')" || true
            fc-cache -f >/dev/null 2>&1 || true
          fi
          fc-list | grep -i "Arial Black" | head -2 || echo "sin Arial Black (libass usara fallback)"
      - name: Seguir directo y cortar picos (Cola LIVE del panel)
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          PANEL_TENANT: sebastian
          PANEL_USERNAME: ${{ secrets.PANEL_USERNAME }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          # Sin esta key la revisión de picos no tiene juez Gemini y
          # cae siempre al fallback pre-corte (medido 2026-11-18 en
          # el clip de djmariio: "sin GEMINI_API_KEY").
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # URL DIRECTA del Worker, NO el front de Pages: Pages
          # corta las llamadas API desde Actions (RemoteDisconnected
          # / 405 vacíos; medido 2026-11-18: login 200 por el Worker
          # directo y conexión cortada por Pages con el mismo
          # request). El front para humanos sigue en Pages.
          PANEL_URL: https://avc.vikingosfoodspa.workers.dev
        run: |
          python -m clipagent live "${{ matrix.target.name }}" \
            --platform "${{ matrix.target.platform }}" \
            --cut --minutes "${{ inputs.minutes || '10' }}"
      - name: Guardar estado (picos y clips de la sesión)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cutter-${{ matrix.target.name }}-${{ github.run_id }}
          path: |
            runs/live/
          if-no-files-found: ignore
          retention-days: 7

  vod-fallback:
    name: Fallback VOD (sin ES en vivo en GTA VI)
    needs: detect
    if: needs.detect.outputs.es_count == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: sebastian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache de pip (sin caché, torch/whisper tarda hasta ~28 min)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "pip-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}"
          restore-keys: |
            pip-${{ runner.os }}-py312-
      - name: Instalar ffmpeg y TwitchDownloaderCLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-fonttools
          TDL_VERSION="1.56.5"
          curl -sSL -o /tmp/twitchdownloader.zip \
            "https://github.com/lay295/TwitchDownloader/releases/download/${TDL_VERSION}/TwitchDownloaderCLI-${TDL_VERSION}-Linux-x64.zip"
          sudo unzip -o -q /tmp/twitchdownloader.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/TwitchDownloaderCLI
          TwitchDownloaderCLI --help || true
          python -m pip install -q -e ".[whisper]"
          # Arial Black GENUINA (plantilla v2): el quemado de
          # subtítulos + título (workers.subtitle_clip) usa Arial
          # Black. Mismo bloque que el job `cut`.
          if ! fc-list | grep -qi "Arial Black"; then
            mkdir -p ~/.fonts
            curl -fsSL -o ~/.fonts/ariblk.woff \
              "https://fonts.cdnfonts.com/s/97850/ariblk%201.woff" || true
            python3 -c "from fontTools.ttLib import TTFont; f=TTFont('$HOME/.fonts/ariblk.woff'); f.flavor=None; f.save('$HOME/.fonts/arial-black.ttf')" || true
            fc-cache -f >/dev/null 2>&1 || true
          fi
          fc-list | grep -i "Arial Black" | head -2 || echo "sin Arial Black (libass usara fallback)"
      # Estado persistente entre corridas (enfriamiento por VOD):
      # el runner es efímero; se restaura del artefacto de la
      # corrida anterior y se vuelve a subir al final. Separado
      # del estado diario (cerebro-state-sebastian) para no pisarlo.
      # OJO: actions/download-artifact sin run-id solo busca en la
      # corrida ACTUAL (donde el artefacto aún no existe), así que
      # el restore siempre venía vacío y cada corrida reprocesaba
      # los 2 VODs. Se baja con gh desde la última corrida
      # completada de este workflow (se prueban las 5 últimas por
      # si alguna falló antes de subir el estado).
      - name: Restaurar estado del fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p runs/vod-fallback
          for id in $(gh run list --workflow cerebro-live.yml --status completed --limit 5 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" -n cerebro-live-vod-state -D runs/vod-fallback 2>/dev/null; then
              echo "estado restaurado de la corrida $id"
              break
            fi
          done
          ls runs/vod-fallback/state.json 2>/dev/null || echo "sin estado previo: se empieza vacío"
      - name: Modo VOD (Rubius, IlloJuan) -> Cola del panel, sin publicar
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PANEL_TENANT: sebastian
          PANEL_USERNAME: ${{ secrets.PANEL_USERNAME }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          PANEL_URL: https://avc.vikingosfoodspa.workers.dev
        run: |
          python -m clipagent vod-fallback \
            --max-vods 2 --max-clips 2 --top-n 2 \
            --streamers "${{ inputs.streamers || '' }}" \
            ${{ inputs.force == 'true' && '--ignore-cooldown' || '' }}
      - name: Guardar estado del fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-live-vod-state
          path: runs/vod-fallback/state.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Guardar manifiestos (qué picos se cortaron/descartaron)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vod-fallback-${{ github.run_id }}
          path: |
            runs/vod-fallback/*/manifest.json
          if-no-files-found: ignore
          retention-days: 7
