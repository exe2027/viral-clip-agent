# Cerebro — Live Cutter (monitoreo en vivo simultáneo, GENÉRICO)
#
# 2026-11-19, cerebro genérico: UN solo workflow para TODOS los
# tenants. Nada de `environment: <tenant>` ni secretos por tenant
# en GitHub: las credenciales salen DEL PANEL (donde cada usuario
# ya conecta sus cuentas). El Worker dispara `panel-live` (tipo
# FIJO; el tenant va en el client_payload, junto a un token de un
# solo uso) y cada job arranca con el paso bootstrap
# (`python -m clipagent.panel_credentials`), que canjea el token
# por una sesión de 12 h y materializa las credenciales en el
# runner. El token es de UN SOLO USO: lo canjea el job `detect` y
# la sesión pasa a `cut`/`vod-fallback` por ARTEFACTO
# (`panel-session-<tenant>-<run_id>`, retención 1 día, borrado
# por el job `cleanup-session` al terminar la corrida). NO por
# outputs: GitHub VACÍA un output cuyo valor fue registrado con
# ::add-mask:: (verificado 2026-11-19: MASKED EMPTY / PLAIN OK;
# el orden no importa) y ese fue el fallo de las corridas
# 44655780311 y 44656729371 (detect OK, todos los cortes caídos
# en el bootstrap con PANEL_SESSION_TOKEN vacío). Sin token no
# hay corrida: el bootstrap sale con error claro ("dispara
# desde el panel con Iniciar").
#
# Disparadores (el Worker es la ÚNICA fuente: sin cron aquí, un
# run por cron no tendría token para autenticarse):
# - repository_dispatch panel-live (cada 15 min por tenant en
#   marcha, con throttle por tenant en D1: una corrida de un
#   tenant no frena a otro).
# - workflow_dispatch manual (tenant obligatorio, sin default).
#
# Concurrencia por tenant: dos corridas del MISMO tenant nunca
# van en paralelo (cancel-in-progress: false, encolan); las de
# tenants distintos sí pueden correr a la vez.
#
# MEDIDO 2026-11-18: una corrida dura ~11-13 min (setup + sesión
# 10 min); con triggers cada 15 min y cancel-in-progress: false
# ninguna se cancela a mitad (el fallo real del 18: triggers cada
# 10 min + cancel-in-progress: true cancelaban todas).
#
# - job `detect` (~1 min): clipagent.live_scan lee en vivo +
#   categoría GTA VI por API oficial (Helix / Kick API v2).
#   YouTube no tiene watcher en vivo todavía: se salta con nota.
#   La lista de streamers sale DEL PANEL del tenant (no de
#   streamers.yaml: esa es la lista del repo, de otro tenant).
# - job `cut` (matrix, un job por streamer en vivo, max 4 en
#   paralelo): `python -m clipagent live <name> --cut --minutes 10`.
#   Cada sesión re-verifica vivo + GTA VI (CategoryGate), aplica
#   la puerta pre-render + revisión de los mejores picos
#   (clipagent.review) y encola en la Cola LIVE del panel vía
#   PanelBridge.
# - job `vod-fallback`: si nadie está en vivo en GTA VI en ningún
#   idioma (count == 0), cambia solo a modo VOD y corta de los
#   VOD más recientes con los mismos filtros (viralidad >= 45,
#   SEO >= 80, 40-60 s). Máx. 2 VODs y 2 clips por corrida, 6 h
#   de enfriamiento por VOD (estado en el artefacto
#   cerebro-live-vod-state-<tenant>, bajado con gh desde la
#   última corrida completada). Los clips van a la Cola del panel
#   con el MP4 (origin='vod'), SIN publicar. Nunca baja el VOD
#   entero (solo el segmento del pico).
# - Fase en vivo: detect reporta buscando_picos / sin_directos,
#   cut reporta cortando_clip y el fallback modo_vod (y
#   sin_directos al terminar), todo a POST /api/worker/phase.
#   La fase nunca tumba una corrida. ATASCADO lo decide solo el
#   validador del Worker.
name: Cerebro — Live Cutter

on:
  repository_dispatch:
    types: [panel-live]
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant del panel (p. ej. sebastian, kaez)"
        required: true
      streamers:
        description: "Canales a vigilar, separados por comas (vacío = todos los enabled del panel)"
        required: false
        default: ""
      minutes:
        description: "Minutos de sesión por streamer en vivo"
        required: false
        default: "10"
      force:
        description: "Reprocesar VODs intentados hace <6 h (ignora el enfriamiento; solo para reintentos tras un arreglo)"
        required: false
        default: "false"

concurrency:
  group: cerebro-live-${{ github.event.client_payload.tenant || inputs.tenant }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detectar en vivo en GTA VI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      live: ${{ steps.scan.outputs.live }}
      count: ${{ steps.scan.outputs.count }}
      es_count: ${{ steps.scan.outputs.es_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -q -e .
      # Bootstrap: credenciales del tenant desde el panel. Canjea
      # el token de un solo uso del dispatch por una sesión de 12 h
      # y la deja en $GITHUB_ENV (PANEL_SESSION_TOKEN) para los
      # pasos de este job. Sin token (p. ej. cron) falla con
      # mensaje claro: dispara desde el panel con Iniciar.
      - name: Credenciales desde el panel
        id: bootstrap
        env:
          PANEL_TENANT: ${{ github.event.client_payload.tenant || inputs.tenant }}
          PANEL_BRAIN_TOKEN: ${{ github.event.client_payload.brain_token }}
        run: python -m clipagent.panel_credentials
      # Sesión para cut/vod-fallback: por ARTEFACTO, no por output
      # (GitHub vacía un output enmascarado con ::add-mask::).
      # El archivo lleva la sesión en claro: el artefacto vive
      # solo esta corrida (retención 1 día) y el job
      # cleanup-session lo borra al terminar. El repo debe ser
      # privado (pendiente) para que el artefacto no sea público.
      - name: Guardar sesión del panel (artefacto)
        run: |
          test -n "$PANEL_SESSION_TOKEN" || { echo "ERROR: sin sesión del panel tras el bootstrap" >&2; exit 1; }
          printf '%s' "$PANEL_SESSION_TOKEN" > panel-session.txt
          test -s panel-session.txt || { echo "ERROR: panel-session.txt vacío" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: panel-session-${{ github.event.client_payload.tenant || inputs.tenant }}-${{ github.run_id }}
          path: panel-session.txt
          if-no-files-found: error
          retention-days: 1
      - name: Barrido simultáneo (todos los enabled, ES + EN)
        id: scan
        env:
          STREAMERS: ${{ inputs.streamers || '' }}
          # Fase en vivo (2026-11-19): el barrido reporta al panel
          # buscando_picos (hay directos en GTA VI, ES o EN) o
          # sin_directos (nadie en GTA VI); el job cut reporta
          # cortando_clip y el fallback modo_vod. Las credenciales
          # (Twitch, Gemini) y la sesión del panel las deja el
          # bootstrap en el entorno del runner.
          PANEL_URL: https://avc.vikingosfoodspa.workers.dev
        run: python -m clipagent.live_scan

  cut:
    name: Cortar en vivo (${{ matrix.target.name }})
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJson(needs.detect.outputs.live) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache de pip (sin caché, torch/whisper tarda hasta ~28 min)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "pip-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}"
          restore-keys: |
            pip-${{ runner.os }}-py312-
      - name: Instalar ffmpeg, streamlink y whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg streamlink
          python -m pip install -q -e ".[whisper]"
          # Arial Black GENUINA (plantilla v2, 2026-11-18): título y
          # subtítulos usan SUBS_FONT = "Arial Black". Sin ella
          # libass cae a otra fuente: los subtítulos salen en la
          # fuente equivocada y el título (al cablearlo) se
          # desborda sobre el gameplay (medido en CI 2026-11-19:
          # 2311 px blancos bajo la franja). Mismo bloque que
          # render-rdjavi.yml (WOFF cdnfonts -> TTF con fontTools).
          # fontTools viene de pyproject (dependencies): `pip
          # install -e .` la deja en el intérprete ACTIVO de
          # setup-python; `apt install python3-fonttools` solo la
          # dejaba en el python del sistema, invisible para ese
          # intérprete (medido 2026-11-19, corrida 01:08:
          # ModuleNotFoundError en todos los jobs). Por eso la
          # conversión corre con `python` (nunca `python3`) y SIN
          # `|| true`: si el WOFF se descargó y la conversión
          # falla, el paso falla con mensaje claro. El `|| true`
          # queda SOLO en el curl de descarga.
          if ! fc-list | grep -qi "Arial Black"; then
            mkdir -p ~/.fonts
            curl -fsSL -o ~/.fonts/ariblk.woff \
              "https://fonts.cdnfonts.com/s/97850/ariblk%201.woff" || true
            test -s "$HOME/.fonts/ariblk.woff" || { echo "ERROR: no se descargo ~/.fonts/ariblk.woff (curl fallo)" >&2; exit 1; }
            python -c "from fontTools.ttLib import TTFont; f=TTFont('$HOME/.fonts/ariblk.woff'); f.flavor=None; f.save('$HOME/.fonts/arial-black.ttf')"
            test -s "$HOME/.fonts/arial-black.ttf" || { echo "ERROR: fontTools no genero ~/.fonts/arial-black.ttf" >&2; exit 1; }
            fc-cache -f >/dev/null 2>&1 || true
          fi
          fc-list | grep -i "Arial Black" | head -2 || echo "sin Arial Black (libass usara fallback)"
      # Sesión del panel: viene del artefacto panel-session que
      # subió detect (el token de un solo uso ya está canjeado;
      # este job no puede canjearlo de nuevo y un output no sirve:
      # GitHub vacía un output enmascarado). Se lee del archivo,
      # se enmascara ANTES de exportarla (así ningún env dump
      # posterior la muestra en claro) y queda en $GITHUB_ENV
      # para el bootstrap y el resto de pasos de este job.
      - name: Descargar sesión del panel (artefacto)
        uses: actions/download-artifact@v4
        with:
          name: panel-session-${{ github.event.client_payload.tenant || inputs.tenant }}-${{ github.run_id }}
          path: .panel-session
      - name: Exportar sesión del panel
        run: |
          test -s .panel-session/panel-session.txt || { echo "ERROR: artefacto panel-session vacío o ausente" >&2; exit 1; }
          SESSION_TOKEN="$(cat .panel-session/panel-session.txt)"
          test -n "$SESSION_TOKEN" || { echo "ERROR: sesión vacía en el artefacto" >&2; exit 1; }
          echo "::add-mask::$SESSION_TOKEN"
          echo "PANEL_SESSION_TOKEN=$SESSION_TOKEN" >> "$GITHUB_ENV"
          rm -f .panel-session/panel-session.txt
      # Bootstrap: materializa las credenciales del tenant
      # (Twitch, Gemini) en el entorno del runner con la sesión
      # que dejó el paso anterior.
      - name: Credenciales desde el panel
        env:
          PANEL_TENANT: ${{ github.event.client_payload.tenant || inputs.tenant }}
        run: python -m clipagent.panel_credentials
      - name: Seguir directo y cortar picos (Cola LIVE del panel)
        env:
          # URL DIRECTA del Worker, NO el front de Pages: Pages
          # corta las llamadas API desde Actions (RemoteDisconnected
          # / 405 vacíos; medido 2026-11-18: login 200 por el Worker
          # directo y conexión cortada por Pages con el mismo
          # request). El front para humanos sigue en Pages.
          PANEL_URL: https://avc.vikingosfoodspa.workers.dev
        run: |
          python -m clipagent live "${{ matrix.target.name }}" \
            --platform "${{ matrix.target.platform }}" \
            --lang "${{ matrix.target.language }}" \
            --cut --minutes "${{ inputs.minutes || '10' }}"
      - name: Guardar estado (picos y clips de la sesión)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cutter-${{ matrix.target.name }}-${{ github.run_id }}
          path: |
            runs/live/
          if-no-files-found: ignore
          retention-days: 7

  vod-fallback:
    name: Fallback VOD (sin directos en GTA VI)
    needs: detect
    if: needs.detect.outputs.count == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache de pip (sin caché, torch/whisper tarda hasta ~28 min)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "pip-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}"
          restore-keys: |
            pip-${{ runner.os }}-py312-
      - name: Instalar ffmpeg y TwitchDownloaderCLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          TDL_VERSION="1.56.5"
          curl -sSL -o /tmp/twitchdownloader.zip \
            "https://github.com/lay295/TwitchDownloader/releases/download/${TDL_VERSION}/TwitchDownloaderCLI-${TDL_VERSION}-Linux-x64.zip"
          sudo unzip -o -q /tmp/twitchdownloader.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/TwitchDownloaderCLI
          TwitchDownloaderCLI --help || true
          python -m pip install -q -e ".[whisper]"
          # Arial Black GENUINA (plantilla v2): el quemado de
          # subtítulos + título (workers.subtitle_clip) usa Arial
          # Black. Mismo bloque que el job `cut`.
          # fontTools viene de pyproject (dependencies): la
          # conversión corre con `python` (nunca `python3`) y SIN
          # `|| true`; el `|| true` queda SOLO en el curl.
          # (2026-11-19: apt python3-fonttools no la dejaba en el
          # intérprete de setup-python -> ModuleNotFoundError.)
          if ! fc-list | grep -qi "Arial Black"; then
            mkdir -p ~/.fonts
            curl -fsSL -o ~/.fonts/ariblk.woff \
              "https://fonts.cdnfonts.com/s/97850/ariblk%201.woff" || true
            test -s "$HOME/.fonts/ariblk.woff" || { echo "ERROR: no se descargo ~/.fonts/ariblk.woff (curl fallo)" >&2; exit 1; }
            python -c "from fontTools.ttLib import TTFont; f=TTFont('$HOME/.fonts/ariblk.woff'); f.flavor=None; f.save('$HOME/.fonts/arial-black.ttf')"
            test -s "$HOME/.fonts/arial-black.ttf" || { echo "ERROR: fontTools no genero ~/.fonts/arial-black.ttf" >&2; exit 1; }
            fc-cache -f >/dev/null 2>&1 || true
          fi
          fc-list | grep -i "Arial Black" | head -2 || echo "sin Arial Black (libass usara fallback)"
      # Estado persistente entre corridas (enfriamiento por VOD):
      # el runner es efímero; se restaura del artefacto de la
      # corrida anterior y se vuelve a subir al final. El nombre
      # lleva el tenant: el estado de un tenant no es el de otro.
      # OJO: actions/download-artifact sin run-id solo busca en la
      # corrida ACTUAL (donde el artefacto aún no existe), así que
      # el restore siempre venía vacío y cada corrida reprocesaba
      # los 2 VODs. Se baja con gh desde la última corrida
      # completada de este workflow (se prueban las 5 últimas por
      # si alguna falló antes de subir el estado).
      - name: Restaurar estado del fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TENANT: ${{ github.event.client_payload.tenant || inputs.tenant }}
        run: |
          mkdir -p runs/vod-fallback
          for id in $(gh run list --workflow cerebro-live.yml --status completed --limit 5 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" -n "cerebro-live-vod-state-$TENANT" -D runs/vod-fallback 2>/dev/null; then
              echo "estado restaurado de la corrida $id"
              break
            fi
          done
          ls runs/vod-fallback/state.json 2>/dev/null || echo "sin estado previo: se empieza vacío"
      # Sesión del panel: igual que en cut, del artefacto
      # panel-session que subió detect (ver el paso "Descargar
      # sesión del panel" de cut: descarga, enmascara y exporta
      # a $GITHUB_ENV para este job).
      - name: Descargar sesión del panel (artefacto)
        uses: actions/download-artifact@v4
        with:
          name: panel-session-${{ github.event.client_payload.tenant || inputs.tenant }}-${{ github.run_id }}
          path: .panel-session
      - name: Exportar sesión del panel
        run: |
          test -s .panel-session/panel-session.txt || { echo "ERROR: artefacto panel-session vacío o ausente" >&2; exit 1; }
          SESSION_TOKEN="$(cat .panel-session/panel-session.txt)"
          test -n "$SESSION_TOKEN" || { echo "ERROR: sesión vacía en el artefacto" >&2; exit 1; }
          echo "::add-mask::$SESSION_TOKEN"
          echo "PANEL_SESSION_TOKEN=$SESSION_TOKEN" >> "$GITHUB_ENV"
          rm -f .panel-session/panel-session.txt
      # Bootstrap: materializa las credenciales del tenant
      # con la sesión que dejó el paso anterior.
      - name: Credenciales desde el panel
        env:
          PANEL_TENANT: ${{ github.event.client_payload.tenant || inputs.tenant }}
        run: python -m clipagent.panel_credentials
      - name: Modo VOD (Rubius, IlloJuan) -> Cola del panel, sin publicar
        env:
          PANEL_URL: https://avc.vikingosfoodspa.workers.dev
        run: |
          python -m clipagent vod-fallback \
            --max-vods 2 --max-clips 2 --top-n 2 \
            --streamers "${{ inputs.streamers || '' }}" \
            ${{ inputs.force == 'true' && '--ignore-cooldown' || '' }}
      - name: Guardar estado del fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-live-vod-state-${{ github.event.client_payload.tenant || inputs.tenant }}
          path: runs/vod-fallback/state.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Guardar manifiestos (qué picos se cortaron/descartaron)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vod-fallback-${{ github.run_id }}
          path: |
            runs/vod-fallback/*/manifest.json
          if-no-files-found: ignore
          retention-days: 7

  cleanup-session:
    name: Borrar sesión del panel (artefacto)
    needs: [cut, vod-fallback]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # La sesión (12 h) vivió en el artefacto panel-session solo
      # durante esta corrida: se borra al terminar para que no
      # quede una credencial en el almacenamiento de Actions
      # (retención 1 día como red de seguridad). Si cut y
      # vod-fallback se saltaron (p. ej. detect falló), no hay
      # artefacto y el paso es un no-op.
      - name: Borrar artefacto panel-session
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: panel-session-${{ github.event.client_payload.tenant || inputs.tenant }}-${{ github.run_id }}
        run: |
          id="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "artefacto panel-session borrado ($id)"
          else
            echo "sin artefacto panel-session que borrar"
          fi
