# Es el único que hace contenido de GTA por ahora y el caso de
# prueba del monitor (watcher.py, 2026-11-16). No hay otros 6:
# los demás se agregarían después SOLO si hacen GTA y dan permiso.
#
# Solo `estado: concedido` cuenta como permiso (ver PERMISOS.md).
# Hoy IlloJuan está en `pendiente`: el watcher lo MONITOREA
# (detecta en vivo y VODs nuevos) pero NO encola nada suyo hasta
# que el permiso esté concedido y con ficha en PERMISOS.md.
# El monitor NO pide permiso en nombre del usuario: solo lee
# datos públicos (directos y VODs) y registra lo que ve.
#
# `estado` solo puede ser:
#   pendiente | contactado | concedido | denegado | revocado
# Un permiso solo cuenta como `concedido` con la ficha completa
# (texto exacto + captura/enlace) en PERMISOS.md.

