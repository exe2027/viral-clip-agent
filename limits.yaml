# limits.yaml — TOPES DIARIOS COMO REGLAS (reglas de publicación 2026-11-19).
#
# Los topes los pone el agente como regla, porque conoce los topes
# de subida de cada plataforma. El usuario NO tiene que adivinarlos:
# en Ajustes del panel se muestran ya puestos con estos valores.
# Cada tope = límite interno del proyecto con margen de seguridad
# para cuentas nuevas. Los valores DEBEN coincidir con los del
# panel (panel-backend/worker/src/db.ts, DEFAULT_PANEL_SETTINGS):
# el panel es el que aplica los topes al publicar; este archivo es
# la regla que usa el publisher del repo.
# Si falta este archivo, publisher.py usa los mismos valores como
# fallback en el código (ver load_limits).
#
# REGLAS 2026-11-19 (reemplazan las del 2026-11-18):
# - Ritmo normal: TikTok 2/día, Instagram 1/día, YouTube 1/día,
#   Facebook 1/día. Máximo duro: TikTok 3, resto 2. Al máximo solo
#   si la cuenta tiene >30 días sin restricción + cola viral alta
#   + últimas 7 mantienen/suben alcance (regla 6).
# - Nunca más de 3 publicaciones por cuenta en 24 h móviles
#   (rolling_24h_max).
# - Calentamiento: cuenta NUEVA si <14 días o <20 publicaciones.
#   Semana 1: máx 1/día. Semana 2: máx 1/día diario. Semana 3+:
#   ritmo normal. Subir solo sin avisos/restricciones/caída de
#   alcance. (Antes: nueva hasta 30 días + 10 publicaciones.)
# - Espaciamiento: misma cuenta mismo día mín 3 h (4 h YouTube),
#   mín absoluto 5 min; mismo clip en distintas plataformas 15-30
#   min mín (ideal 12-24 h); nunca el mismo clip en 2 cuentas de
#   la misma plataforma el mismo día.
# - Franjas (hora Chile, REVOCA la decisión 2026-11-18 "sin
#   franja"): mañana 12:00-14:00, tarde 18:00-20:00, noche
#   21:00-23:00. 1/día: tarde o noche. 2+: mediodía + noche. Hora
#   exacta varía ±10 min cada día (jitter determinista).
# - Días activos por semana: TikTok 5-6, resto 4-5; 1 día libre
#   por semana por cuenta (rotativo, determinista por
#   cuenta+semana).
# - Errores: temporal (red, 429) reintento 5, 15, 45 min, máx 3.
#   Spam/límite: detener esa cuenta, pausa 48 h, reprogramar al
#   día siguiente, NO reintentar el mismo día. Nunca esquivar
#   cambiando de cuenta, IP o método.

# YouTube: la cuota de la Data API v3 ya no limita (videos.insert
# cuesta 1 unidad, ~100 llamadas/día; el plan 1/día queda muy por
# debajo). El tope real es de prudencia anti-ban para cuentas
# nuevas: plan 1/día, máximo 2/día. Fuente cuota:
# https://developers.google.com/youtube/data/revision_history
# (revisado 2026-11-17; historial: 4 dic 2025 baja a ~100 u.,
# 1 jun 2026 bucket propio, 2 nov 2026 1 unidad por llamada).
youtube_shorts:
  plan_per_day: 1
  max_per_day: 2
  days_per_week_min: 4
  days_per_week_max: 5
  quota_upload_cost_units: 1
  quota_upload_calls_per_day: 100
  quota_other_daily_units: 10000
  quota_source_url: "https://developers.google.com/youtube/data/revision_history"
  quota_reviewed: "2026-11-17"
  # plan/max son topes internos del proyecto (prudencia con cuentas
  # nuevas), no un límite de YouTube: por eso reviewed es null.
  source_url: null
  reviewed: null
  note: "TODO: verificar si YouTube impone un tope diario de subidas distinto de la cuota."

# TikTok vía Zernio (VÍA ACTIVA desde 2026-11-18; la app TikTok
# propia sin auditar solo permite SELF_ONLY/privado). Fuente:
# docs.zernio.com (verificado 2026-11-18): 15 vídeos/cuenta/24 h
# (rolling) y máximo 5 borradores pendientes por creador/24 h.
# El plan del proyecto (2/día) aplica un margen grande sobre el
# límite de la plataforma (15/día); el máximo (3/día) sigue muy
# por debajo. zernio_* son los topes DE LA PLATAFORMA (no se
# superan nunca); plan/max son los topes del proyecto.
tiktok:
  plan_per_day: 2
  max_per_day: 3
  days_per_week_min: 5
  days_per_week_max: 6
  zernio_per_day: 15
  zernio_pending_drafts_max: 5
  zernio_source_url: "https://docs.zernio.com"
  zernio_reviewed: "2026-11-18"
  source_url: "https://developers.tiktok.com/doc/content-posting-api-get-started"
  reviewed: null
  note: "Direct Post PROPIO (app sin auditar): creator_info -> init FILE_UPLOAD -> PUT por chunks 5-64 MB -> status/fetch; init 6 peticiones/min. Sin auditoría de la app, TikTok solo permite publicar en privado (error unaudited_client_can_only_post_to_private_accounts) y el sistema cae a draft. VÍA ACTIVA desde 2026-11-18: Zernio (app TikTok for Business auditada de Zernio): POST /v1/posts con publishNow true, PUBLIC_TO_EVERYONE, pre-chequeo dryRun; publica en PÚBLICO sin auditoría propia (verificado en docs.zernio.com 2026-11-18). Tope diario de la plataforma vía Zernio: 15 vídeos/cuenta/24 h (rolling). plan/max son topes internos del proyecto, más estrictos."

# Instagram Reels (Meta): la doc oficial devolvió 403 al verificarla
# 2026-11-17; las guías citan 50 Reels/día por cuenta (sin verificar
# en la fuente oficial). Plan 1/día = margen grande sobre ese valor.
instagram_reels:
  plan_per_day: 1
  max_per_day: 2
  days_per_week_min: 4
  days_per_week_max: 5
  platform_daily_limit_claimed: 50
  source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-api-with-instagram-login/"
  reviewed: null
  note: "TODO: la doc oficial de Meta devolvió 403 al verificarla 2026-11-17; el flujo (contenedor -> FINISHED -> publicar, URL HTTPS pública obligatoria) está corroborado por varias guías que citan esa doc. Sin verificar: límite diario (50 vs 100 según la fuente) y duración máxima por API (90 s vs 15 min). plan/max son topes internos del proyecto."

# Facebook Reels (Meta): las guías citan 30 Reels/día por Página
# (sin verificar en la fuente oficial). Plan 1/día = margen grande.
facebook_reels:
  plan_per_day: 1
  max_per_day: 2
  days_per_week_min: 4
  days_per_week_max: 5
  platform_daily_limit_claimed: 30
  source_url: "https://developers.facebook.com/docs/video-api/guides/reels-publishing"
  reviewed: null
  note: "TODO: la doc oficial de Meta devolvió 403 al verificarla 2026-11-17; el flujo en 3 fases (start -> rupload.facebook.com -> finish) está corroborado por varias guías que citan esa doc. Requisitos del video (MP4 9:16, 3-90 s) y límite de 30 Reels/día por Página según esas guías, sin verificar en la fuente oficial. plan/max son topes internos del proyecto."

# Frenos internos del proyecto (no son límites de plataforma).
min_spacing_hours: 3
youtube_spacing_hours: 4
min_spacing_minutes: 5
cross_platform_min_minutes: 15
cross_platform_ideal_hours_min: 12
rolling_24h_max: 3
rest_day_per_week: 1
slot_jitter_minutes: 10
# Franjas de publicación (hora Chile, America/Santiago).
# REVOCA la decisión 2026-11-18 ("sin franja horaria").
# Claves leídas por clipagent/publish.py (time_slots dict).
time_slots:
  morning: ["12:00", "14:00"]
  afternoon: ["18:00", "20:00"]
  night: ["21:00", "23:00"]
# Días activos por semana (tabla de la regla 2: TikTok 5-6,
# resto 4-5): van como days_per_week_min/max en cada plataforma
# arriba. Lo que se aplica como freno es 1 día libre por semana
# por cuenta (rest_day_per_week, rotativo y determinista por
# cuenta+semana, regla 7).
# Hashtags: máx 5 en Instagram, 3-5 en el resto.
hashtag_max:
  instagram_reels: 5
  other: 5
# Calentamiento (2026-11-19): cuenta nueva si <14 días o <20
# publicaciones. Semana 1: máx 1/día. Semana 2: máx 1/día diario.
# Semana 3+: ritmo normal.
warmup:
  new_if_days: 14
  new_if_publishes: 20
  week1_max_per_day: 1
  week2_max_per_day: 1
new_account_daily: 1
# Reintentos (regla 8): temporal (red, 429) 5, 15, 45 min, máx 3.
# Spam/límite: detener la cuenta, pausa 48 h, reprogramar al día
# siguiente, sin reintento el mismo día.
retry_backoff_minutes: [5, 15, 45]
max_transient_retries: 3
pause_hours: 48

