# limits.yaml — TOPES DIARIOS COMO REGLAS (orden del usuario 2026-11-18).
#
# Los topes los pone el agente como regla, porque conoce los topes
# de subida de cada plataforma. El usuario NO tiene que adivinarlos:
# en Ajustes del panel se muestran ya puestos con estos valores.
# Cada tope = límite de la plataforma (fuente) con margen de
# seguridad para cuentas nuevas (la cuenta es nueva hasta 30 días
# desde su primera publicación + 10 publicaciones sin sanciones;
# el escalado automático vive en el Worker del panel, ver
# panel-backend; aquí están los valores que ese escalado usa).
# Si falta este archivo, publisher.py usa los mismos valores como
# fallback en el código (ver load_limits).
#
# YouTube: la cuota de la Data API v3 ya no limita (videos.insert
# cuesta 1 unidad, ~100 llamadas/día; el plan 3-5/día queda muy por
# debajo). El tope real es de prudencia anti-ban para cuentas
# nuevas: plan 3/día, máximo 5/día. Fuente cuota:
# https://developers.google.com/youtube/data/revision_history
# (revisado 2026-11-17; historial: 4 dic 2025 baja a ~100 u.,
# 1 jun 2026 bucket propio, 2 nov 2026 1 unidad por llamada).
youtube_shorts:
  plan_per_day: 3
  max_per_day: 5
  quota_upload_cost_units: 1
  quota_upload_calls_per_day: 100
  quota_other_daily_units: 10000
  quota_source_url: "https://developers.google.com/youtube/data/revision_history"
  quota_reviewed: "2026-11-17"
  # plan/max son topes internos del proyecto (prudencia con cuentas
  # nuevas), no un límite de YouTube: por eso reviewed es null.
  source_url: null
  reviewed: null
  note: "TODO: verificar si YouTube impone un tope diario de subidas distinto de la cuota."

# TikTok vía Zernio (VÍA ACTIVA desde 2026-11-18; la app TikTok
# propia sin auditar solo permite SELF_ONLY/privado). Fuente:
# docs.zernio.com (verificado 2026-11-18): 15 vídeos/cuenta/24 h
# (rolling) y máximo 5 borradores pendientes por creador/24 h.
# El plan del proyecto (2/día) aplica un margen grande sobre el
# límite de la plataforma (15/día); el máximo (3/día) sigue muy
# por debajo. zernio_* son los topes DE LA PLATAFORMA (no se
# superan nunca); plan/max son los topes del proyecto.
tiktok:
  plan_per_day: 2
  max_per_day: 3
  zernio_per_day: 15
  zernio_pending_drafts_max: 5
  zernio_source_url: "https://docs.zernio.com"
  zernio_reviewed: "2026-11-18"
  source_url: "https://developers.tiktok.com/doc/content-posting-api-get-started"
  reviewed: null
  note: "Direct Post PROPIO (app sin auditar): creator_info -> init FILE_UPLOAD -> PUT por chunks 5-64 MB -> status/fetch; init 6 peticiones/min. Sin auditoría de la app, TikTok solo permite publicar en privado (error unaudited_client_can_only_post_to_private_accounts) y el sistema cae a draft. VÍA ACTIVA desde 2026-11-18: Zernio (app TikTok for Business auditada de Zernio): POST /v1/posts con publishNow true, PUBLIC_TO_EVERYONE, pre-chequeo dryRun; publica en PÚBLICO sin auditoría propia (verificado en docs.zernio.com 2026-11-18). Tope diario de la plataforma vía Zernio: 15 vídeos/cuenta/24 h (rolling). plan/max son topes internos del proyecto, más estrictos."

# Instagram Reels (Meta): la doc oficial devolvió 403 al verificarla
# 2026-11-17; las guías citan 50 Reels/día por cuenta (sin verificar
# en la fuente oficial). Plan 2/día = margen grande sobre ese valor.
instagram_reels:
  plan_per_day: 2
  max_per_day: 3
  platform_daily_limit_claimed: 50
  source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-api-with-instagram-login/"
  reviewed: null
  note: "TODO: la doc oficial de Meta devolvió 403 al verificarla 2026-11-17; el flujo (contenedor -> FINISHED -> publicar, URL HTTPS pública obligatoria) está corroborado por varias guías que citan esa doc. Sin verificar: límite diario (50 vs 100 según la fuente) y duración máxima por API (90 s vs 15 min). plan/max son topes internos del proyecto."

# Facebook Reels (Meta): las guías citan 30 Reels/día por Página
# (sin verificar en la fuente oficial). Plan 2/día = margen grande.
facebook_reels:
  plan_per_day: 2
  max_per_day: 3
  platform_daily_limit_claimed: 30
  source_url: "https://developers.facebook.com/docs/video-api/guides/reels-publishing"
  reviewed: null
  note: "TODO: la doc oficial de Meta devolvió 403 al verificarla 2026-11-17; el flujo en 3 fases (start -> rupload.facebook.com -> finish) está corroborado por varias guías que citan esa doc. Requisitos del video (MP4 9:16, 3-90 s) y límite de 30 Reels/día por Página según esas guías, sin verificar en la fuente oficial. plan/max son topes internos del proyecto."

# Frenos internos del proyecto (no son límites de plataforma).
min_spacing_hours: 2
# publish_window ELIMINADO 2026-11-18 (decisión del usuario:
# sin franja horaria, se publica a cualquier hora).
new_account_daily: 1
# Escalado automático (orden del usuario 2026-11-18; lo aplica el
# Worker del panel cada día, ver panel-backend): cuenta NUEVA (1/día)
# hasta 30 días desde su primera publicación + 10 publicaciones sin
# sanciones; entonces pasa a ESTABLECIDA (plan normal por plataforma).
established_after_days: 30
established_min_publishes: 10
