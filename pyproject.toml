# pyproject.toml — viral-clip-agent (Fase 5.3).
#
# Dependencias mínimas por diseño (regla de coste $0 y sin
# dependencias pesadas): el núcleo solo necesita PyYAML; todo lo
# demás es opcional con fallback (sin faster-whisper no hay
# subtítulos; sin cv2 el recorte es centrado; sin las libs de
# Google la subida a YouTube cae a borrador).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-clip-agent"
version = "5.4.1"
description = "Detector de clips virales de VODs de Twitch/Kick: chat -> picos -> corte 9:16 -> subtítulos -> paquete SEO -> publicación con red de seguridad"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    # Render (plantilla v2): la conversión WOFF->TTF de Arial Black
    # usa fontTools. Sin ella el runner cae a otra fuente: medido
    # 2026-11-19, corrida 01:08, `ModuleNotFoundError: No module
    # named 'fontTools'` en todos los jobs del live-cutter (tragado
    # por `|| true`). Es dependencia real del pipeline, no opcional:
    # `pip install -e .` (o .[whisper]) la instala en el intérprete
    # activo de setup-python; `apt install python3-fonttools` solo
    # la dejaba en el python del sistema, invisible para ese
    # intérprete.
    "fontTools>=4.0",
    # Render (plantilla rubius, default desde 2026-11-19): el banner
    # amarillo del título es un PNG dibujado con PIL
    # (clipagent/rubius.py make_banner_png: rectángulo redondeado
    # + borde blanco + dos líneas Arial Black). Sin Pillow el
    # render rubius no puede componer el banner: es dependencia
    # real del pipeline, no opcional (mismo caso que fontTools).
    # El gate cuadro por cuadro también lee los fotogramas con PIL
    # (render_gate, job de render en CircleCI).
    "Pillow>=10.0",
    # Fuente YouTube (youtube.py, 2026-11-21): detección de VODs y
    # directos + descarga de segmentos con yt-dlp (--flat-playlist,
    # --download-sections). Sin el módulo, youtube.py solo puede
    # usar el binario si existe; en CI no hay binario y los tests
    # de la fuente fallan con ModuleNotFoundError. Es dependencia
    # real del pipeline, no opcional (mismo caso que fontTools /
    # Pillow): el cerebro la usa para la fuente YouTube.
    "yt-dlp>=2024.0",
]

[project.optional-dependencies]
# Subtítulos con faster-whisper (local, sin red). Sin él, transcribe
# avisa y el clip queda sin subtítulos quemados.
whisper = [
    "faster-whisper>=1.0",
]
# Visión de miniaturas y seguimiento de cara (OpenCV + numpy).
# Sin cv2, el recorte 9:16 usa el centro como fallback.
# PIN <5: cv2 5.x eliminó CascadeClassifier y el XML de Haar
# (verificado 2026-11-17: cv2 5.0.0 no tiene CascadeClassifier),
# y la detección de caras depende de ambos. Sin el pin, CI
# instalaría 5.x y detect_faces_1fps devolvería None.
vision = [
    "opencv-python-headless>=4.8,<5",
    "numpy>=1.26",
]
# Subida real a YouTube por API (OAuth + thumbnails.set). Sin estas
# libs, YouTube cae a borrador (draft-first) y no se rompe nada.
youtube = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
]
# Agente navegador TikTok (Playwright Python, runner autoalojado).
# Sin él, el agente no puede abrir el navegador; los tests usan un
# fake y no lo necesitan. Instalar en la PC del usuario + Chromium:
#   pip install -e .[browser] && python -m playwright install chromium
# Cortador en vivo (live_cutter.py): graba el directo por HLS con
# streamlink + ffmpeg (sin streamlink no hay grabación; el resto del
# cutter — detección, corte, subtítulos — sigue funcionando en replay).
live = [
    "streamlink>=6.0",
]
browser = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
clipagent = "clipagent.cli:main"

[tool.setuptools.packages.find]
include = ["clipagent*"]

[tool.pytest.ini_options]
# La suite incluye runs/arreglo6/test_center_track.py (lenta, ~3 min:
# procesa vídeo real). No se excluye: es el único test del
# seguimiento de cara.
testpaths = ["."]

[tool.ruff]
# Reglas curadas (Fase 5): solo errores y fallos de import. El repo
# tiene ~175 avisos con las reglas por defecto (EXE001, BLE001,
# etc.), preexistentes y fuera de alcance; se corrigen de a poco.
line-length = 79
target-version = "py310"
lint.select = ["E", "F"]
lint.ignore = [
    "E501",  # líneas largas en docstrings/URLs: se revisan a mano
]
[tool.ruff.lint.per-file-ignores]
# Shims deprecados de la Fase 5.1: avisan y re-exportan el módulo
# nuevo; el import va después del aviso por diseño (E402).
"config.py" = ["F401", "F403", "E402"]
"clips_chat_v2.py" = ["F401", "F403", "E402"]
"viral_score.py" = ["F401", "F403", "E402"]
"subtitles.py" = ["F401", "F403", "E402"]
"layout.py" = ["F401", "F403", "E402"]
"viral_package.py" = ["F401", "F403", "E402"]
"publisher.py" = ["F401", "F403", "E402"]
"audio.py" = ["F401", "F403", "E402"]
"precise_cut.py" = ["F401", "F403", "E402"]
"seo_score.py" = ["F401", "F403", "E402"]
"priority.py" = ["F401", "F403", "E402"]
"thumbnails.py" = ["F401", "F403", "E402"]
"moment_card.py" = ["F401", "F403", "E402"]
"vision.py" = ["F401", "F403", "E402"]
# Tests: imports tras sys.path, estilo propio.
"test_*.py" = ["E402"]
"runs/*" = ["E402"]
