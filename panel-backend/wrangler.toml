# wrangler.toml — instalación ÚNICA multi-tenant (avc.pages.dev)
# Decisión del usuario 17 nov 2026, 15:05 y 15:33: UNA sola página,
# https://avc.pages.dev, con login al entrar. Cada persona entra con
# su login y ve solo su panel, sus cuentas, su cola y sus
# credenciales. NO un avc-colega.pages.dev separado. AVC = Agent
# Viral Clip.
#
# Recursos (UNA sola cuenta de Cloudflare, la de Sebastián):
#   D1     clips-avc        (una base, tenant_id por fila)
#   R2     clips-avc        (keys clips/<tenant>/<clip_id>/...)
#   Worker avc              (este archivo; avc.<cuenta>.workers.dev)
#   Pages  avc              (el front; https://avc.pages.dev)
#   Cron   cada 5 min (un ciclo por tenant)
#
# SIN secretos aquí: los secretos van con `wrangler secret put`
# (ver DEPLOY-avc.md). Los IDs de D1 se rellenan tras crearlos.
# Los wrangler.toml viejos por tenant (tenants/*/wrangler.toml)
# quedan como LEGADO: no usar.

name = "avc"
main = "worker/src/index.ts"
compatibility_date = "2026-11-17"
workers_dev = true

# Cron del Worker: CADA 5 MIN, TODO EL DÍA (SPEC quitar-franjas
# v2, opción A, 2026-11-26, orden del usuario: sin franjas,
# aleatorio 1:30–3 h, todo publicado en 24 h). Una sola expresión
# (antes 4: */5 15-18, */5 21-23,0-4, 0 12,13 y 0 6,7 UTC). El
# ciclo no tiene puerta horaria (cycle-gate.ts): en cada despertar
# procesa los jobs vencidos; las funciones horarias/diarias
# (resumen 09:00, prune 03:00, monitor horario, informe 20:50)
# se auto-gobiernan por la hora y el dedupe por día, así que
# siguen corriendo a su hora con el cron cada 5 min. Avanza la
# cola SOLO si el tenant inició su Worker (botón Iniciar).
# Un tenant parado no frena al otro.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "clips-avc"
database_id = "5cf19675-f905-4e49-b8f2-96ae0810fafd"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CLIPS_BUCKET"
bucket_name = "clips-avc"

[vars]
# Tenant ÚNICO que sirve este Worker (2026-11-22): SIN ESTA VAR el
# Worker no sirve nada (requireTenant falla: "TENANT no configurado").
# El deploy 04:37 la perdió porque wrangler.toml no la tenía y se
# desplegó sin --var TENANT:sebastian. NUNCA desplegar avc sin ella.
TENANT = "sebastian"
# (2026-11-18, hallazgo M2) Sin PUBLIC_BASE_URL: el bucket R2 es
# privado y no hay dominio público r2.dev. Instagram recibe una URL
# firmada del Worker (/api/public-video, 15 min) solo al publicar.
ALLOWED_EMAIL = ""
# Repo del cerebro (vía principal): el botón Iniciar dispara su
# workflow con repository_dispatch (panel-start). El token
# va como secreto GITHUB_TOKEN (wrangler secret put), nunca aquí.
GITHUB_REPO = "exe2027/viral-clip-agent"
# Proyecto de CircleCI para la recopilación larga (spec 2026-11-26,
# §5.3): slug {vcs}/{org}/{repo}. El token va como secreto
# CIRCLECI_API_TOKEN (wrangler secret put), nunca aquí.
CIRCLECI_PROJECT_SLUG = "gh/exe2027/viral-clip-agent"
# URL pública de R2 para que el cerebro (y las plataformas) puedan
# descargar los clips: valor PÚBLICO, no secreto (2026-11-19,
# cerebro genérico: el cerebro la recibe en /api/bridge/credentials).
CLIP_PUBLIC_BASE_URL = "https://pub-5f09f432fcae41dcb9e4d114ce8ff987.r2.dev"
# URL pública de ESTE Worker (2026-11-22, fix Instagram kaez):
# signVideoUrl firma /api/public-video con SESSION_SECRET propio;
# la URL debe apuntar a este Worker, no al hardcodeado de r2.ts.
WORKER_PUBLIC_URL = "https://avc.vikingosfoodspa.workers.dev"
