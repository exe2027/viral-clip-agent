# ALTERNATIVA dirigida por el Worker — GitHub Actions.
# La vía principal de cómputo es la cadena del cerebro
# (.github/workflows/cerebro-sebastian.yml, cron 09:00). Este workflow
# solo se usa si el Worker necesita disparar subidas fuera de ese cron.
# Copiar a .github/workflows/ de exe2027/viral-clip-agent para activarlo.
name: publish-sebastian (ALTERNATIVA)

on:
  schedule:
    # Cada 30 min en franja 18:00-24:00 Chile (21:00-03:00 UTC).
    - cron: "0,30 21-23 * * *"
    - cron: "0,30 0-3 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: sebastian
    concurrency:
      group: publish-sebastian
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias mínimas
        run: pip install pyyaml google-api-python-client google-auth-oauthlib
      - name: Ejecutar puente (un job)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python3 bridge.py --once
