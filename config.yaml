signals:
  heatmap:
    enabled: true         # leer el heatmap si el VOD es de YouTube
    bucket_s: 10          # ancho del bucket (como Uri)
    top_n: 15             # picos a devolver
    min_separation_s: 60  # separación mínima entre picos
    max_gap_s: 30         # un pico de heatmap solo confirma el pico de chat si está a <= 30 s
  motion:
    enabled: true         # medir % de movimiento en el clip cortado
    threshold: 3.0        # diferencia media por segundo para "se mueve" (como Uri GAME_MOV)
    frozen_max_pct: 10.0  # 0-10% = vídeo en pausa / pantalla fija (criterio de Uri)
    strong_virality_min: 85  # viralidad >= 85 (urgente) para que un clip congelado valga
  game_voice:
    enabled: true         # detectar voz del juego (silencio del streamer + audio activo)
    silence_s: 2.0        # el streamer calla >= 2 s mientras suena el juego
    active_dbfs: -45.0    # RMS por encima de esto = hay sonido de juego

# Aprobación automática por política (6.3): sin humano por clip.
# min_band: null = sin requisito de banda.
auto_approve:
  enabled: true
  min_band: null

# Metadata del paquete (7.5): crédito al streamer en la descripción.
metadata:
  credit_streamer: true

# Directos en vivo (9.2): cooldown entre clips del mismo streamer y
# tope de clips por directo. segment_minutes es la duración prevista
# de cada segmento grabado (5-10 min) cuando la grabación esté
# disponible (hoy BLOQUEADA: sin descargador de directos).
live:
  cooldown_minutes: 10
  max_clips_per_stream: 5
  segment_minutes: 5

# Circuit breaker por plataforma (6.4): N fallos seguidos o un
# rechazo por copyright/strike pausan SOLO esa plataforma.
breaker:
  max_consecutive_failures: 3

# Fan-out: al publicar un clip en YouTube Shorts, se intenta
# publicar también en TikTok, Instagram Reels y Facebook Reels,
# cada una con sus propias puertas (puntaje, cuota, breaker,
# auditoría). enabled: false = sin propagación desde YouTube.
fanout:
  enabled: true

# URL pública del video (fan-out): Instagram exige que Meta
# descargue el video desde una URL HTTPS pública. Esto NO sube
# nada: es la base del hosting estático donde TÚ sirves los clips
# (por ejemplo, el directorio runs/ publicado en un hosting con
# HTTPS). La URL final es base + ruta relativa del clip en el repo.
# Sin base, Instagram queda en draft con el motivo explícito.
# También vale CLIP_PUBLIC_BASE_URL en .env (manda el entorno).
public_url:
  base_url: ""

# IDs de cuenta por plataforma (fan-out): Instagram necesita el
# ig_user_id y Facebook el page_id. No son secretos. Se sacan de
# Meta (Graph API Explorer o la configuración de la app). Vacíos =
# draft con el motivo explícito. También valen IG_USER_ID y
# FACEBOOK_PAGE_ID en .env (mandan sobre esto).
platform_accounts:
  instagram_reels:
    ig_user_id: ""
  facebook_reels:
    page_id: ""

# Panel web (regla del usuario: TODO ES PARA LA WEB, NADA LOCAL).
# El panel vive en Cloudflare (Pages + Worker + D1) y es la única
# superficie de operación: login por usuario, cada tenant ve solo
# lo suyo. Sin secretos aquí: las credenciales van en GitHub
# Secrets / D1 cifrado, nunca en config.
panel:
  base_url: "https://avc-em9.pages.dev"
  worker_url: "https://avc.vikingosfoodspa.workers.dev"

# REGLAS OBVIAS DEL PROYECTO (decisiones del usuario, 2026-11-16/17).
# Antes estaban dispersas en docs, panel y varios .py; este bloque es
# la única lista canónica en config. El código las impone (ver
# clipagent/config.py RULES, precise_cut.py, transcribe.py y
# policy.py); si una regla cambia, cambia aquí Y en el código.
rules:
  # Duración: sin mínimo ni rango prohibido (regla 40-60 / 25-35
  # eliminada por el usuario el 2026-11-21, para siempre). Solo queda
  # el tope duro de 60 s (máximo de un Short).
  min_duration_s: 1         # sin mínimo (regla eliminada 2026-11-21)
  target_duration_s: 40     # objetivo: 40 s (20 pre-roll + 20 post-pico)
  hard_cap_s: 60            # tope duro: 60 s (máximo de un Short)
  forbidden_duration_range: []  # sin rango prohibido (eliminado 2026-11-21)
  pre_roll_s: 20            # 20 s de contexto antes del pico
  # Layout split vertical RDJavi (2026-11-16, invertido 2026-11-18):
  # streamer arriba, gameplay abajo, sin superponerse (salvo los 50 px
  # de solape de la webcam RDJavi); si el juego no se ve, la cámara se
  # achica, nunca al revés. Nunca tapar minimapa ni HUD.
  layout_split: true
  never_cover_minimap_or_hud: true
  # Subtítulos (2026-11-17): siempre en la zona de juego, nunca
  # sobre la cara del influencer / la webcam. MarginV de referencia 230, mínimo 200.
  subtitles_never_over_webcam: true
  subtitle_zone: "gameplay"
  # Juego verificado: nunca afirmar en título/descripción un juego
  # que no está verificado en el clip (ej. decir GTA 6 sobre GTA V).
  never_claim_unverified_game: true
  # Subtítulos falsos: si no hay voz inteligible, NO quemar lo que
  # alucinó Whisper. Usar la transcripción corregida por el usuario
  # (*.transcript_corrected.json en el run) o no quemar nada.
  never_burn_hallucinated_subtitles: true
  user_corrected_transcript_wins: true
  # Subtítulos SIEMPRE y COMPLETOS cuando hay voz (regla
  # 2026-11-17 22:10, matizada 2026-11-19 18:41): todo clip lleva
  # subtítulos quemados de todo lo que dice el influencer; sin voz
  # verificable + pasa puertas (45/80) se publica igual sin
  # subtítulos, nunca se inventa texto.
  subtitles_always: true
  subtitles_complete: true
  publish_no_speech_if_passes_gates: true
  # Categoría (regla 2026-11-18): solo vale GTA VI. El
  # watcher/detector lee la categoría por API oficial (Helix
  # /streams y /channels en Twitch, /api/v2/channels en Kick) y
  # por capítulos del VOD; policy.py y el gate del panel la exigen.
  category_gta6_only: true

# Vigilante con auto-reparación (2026-11-19, orden del usuario:
# los logs son la primera fuente; los chequeos de estado solo
# corroboran). Única fuente de estos valores: clipagent/watchdog.py
# (load_watchdog_config) falla fuerte si falta uno.
watchdog:
  stuck_after_min: 45     # sin clip nuevo en 45 min = atasco (con vivos)
  cooldown_min: 30        # máx 1 escalera cada 30 min
  no_dispatch_min: 20     # dispatch sin corrida posterior en 20 min = no dispara
  no_cycle_min: 20        # sin eventos de ciclo en 20 min con running=1 = silencio
  max_vod_clips: 2        # VOD como último recurso: máx 2 clips
  max_redispatch_per_hour: 2  # tope de re-disparos del vigilante por hora (2026-11-20, cuota D1)
  telegram_enabled: true  # avisar por Telegram solo si sigue atascado
  dispatch_workflow: cerebro-live.yml
  watchdog_workflow: cerebro-watchdog.yml

# Vigilante de publicación (2026-11-21, orden del usuario: hace lo
# que hoy hace Muse por el chat cuando el Worker o las subidas
# fallan). Única fuente de estos valores:
# clipagent/publish_watchdog.py (load_publish_watchdog_config)
# falla fuerte si falta uno. El workflow es
# .github/workflows/cerebro-publish-watchdog.yml (tras cada franja).
publish_watchdog:
  repair_window_min: 60    # tras cada franja, 60 min para reparar lo de ESA franja
  max_cycles_per_run: 1    # como mucho 1 ciclo run-once por corrida
  stuck_processing_min: 30 # processing más de 30 min = atascado (lo mismo que el Worker)
  verify_timeout_s: 20     # timeout por verificación de URL en vivo
  telegram_enabled: true   # avisar por Telegram solo si algo no se pudo arreglar

# Vigilante de tenant atascado (2026-11-21, auto-reparación del
# cerebro): detecta el tenant que nunca arrancó (Worker en marcha,
# last_live_dispatch_at NULL/obsoleto, Cola vacía) y dispara
# panel-start solo. clipagent/tenant_watchdog.py
# (load_tenant_watchdog_config) falla fuerte si falta uno. El
# workflow es .github/workflows/cerebro-tenant-watchdog.yml
# (cada 30 min, entorno `kaez`, ENCENDIDO AHORA para kaez:
# TENANT_WATCHDOG_ENABLED=true; la restricción de las 21:00 es
# SOLO de sebastian, cuya D1 agotó la cuota).
tenant_watchdog:
  cooldown_min: 60            # entre dos auto-reparaciones del mismo tenant
  stale_live_dispatch_min: 60 # last_live_dispatch_at más viejo que esto = obsoleto (NULL = nunca)

# Fuente viral (2026-11-21, orden del usuario: los vídeos que YA
# fueron virales son una fuente permanente, no una tanda manual).
# El workflow .github/workflows/viral-source.yml la corre a diario
# (cron + dispatch manual): descubre Shorts virales de GTA 6 en los
# canales de YouTube de los streamers de la lista, los re-hace a
# rubius real, los valida fotograma a fotograma y los encola vía
# PanelBridge. Única fuente de estos valores:
# clipagent/viral_source.py (load_viral_config) falla fuerte si
# falta uno.
viral_source:
  enabled: true
  min_views: 100000      # un Short tiene que tener >=100k vistas para ser candidato
  min_likes: 5000        # ...y >=5k likes (se verifica con la metadata completa)
  # Outlier multiple (2026-11-21, ig-viral): vistas / mediana de
  # ESA cuenta. >3x es señal; <1,5x es su día normal y no enseña
  # nada. Los likes crudos no son evidencia: un clip de 400k
  # vistas en una cuenta de 2M fue un martes flojo; el mismo en
  # una de 4k encontró algo.
  min_outlier_multiple: 3.0  # un candidato tiene que superar 3x la mediana de su canal
  max_age_days: 30       # solo vídeos de los últimos 30 días
  max_candidates: 5      # candidatos a enriquecer por corrida
  max_per_run: 2         # re-makes como mucho por corrida (cuentas nuevas: 1/día por plataforma)
  shorts_only: true      # solo Shorts (el vídeo YA es el momento: no hay que buscarlo en un VOD)
  min_duration_s: 15     # un Short viral dura entre 15 s...
  max_duration_s: 60     # ...y 60 s (tope del clip)
  cooldown_days: 7       # no reprocesar el mismo vídeo antes de 7 días
  youtube_channels: []   # vacío = canales de YouTube de streamers.yaml; si se llena, solo estos
  state_file: viral-source-claims.json  # claims vídeo -> tenant (un vídeo, UNA sola cuenta)
