# config.yaml — configuración del canal (viral-clip-agent)
#
# Lo que es del canal vive aquí, no hardcodeado en el código. Cambia
# el juego, el streamer o los hashtags sin tocar Python.
#
# Límites de subida por plataforma: orientativos, revisados 2026-11-16
# (ver el documento de auditoría en el repo). No están aquí: cambian
# con frecuencia y pertenecen a limits.yaml, no a la config del canal.

# Herramientas externas (rutas). Vacío = buscar en el PATH.
# twitch_downloader_cli: ruta a TwitchDownloaderCLI si no está en
# el PATH; también vale la variable TWITCH_DL_CLI (manda sobre esto).
# La ruta fija ~/workspace/tools/... de antes no existe en otros
# equipos: no se hardcodea ninguna ruta de un equipo concreto.
tools:
  twitch_downloader_cli: ""

# Juego y lanzamiento (Fase 2.3): la fecha de lanzamiento se
# compara en la zona indicada (antes estaba fija en el código y se
# comparaba en UTC). Un VOD de un juego que no está en "games" es
# rojo del semáforo y el watcher lo salta. Para añadir otro juego,
# basta agregar una entrada con sus patrones de categoría.
game:
  release_date: "2026-11-19"
  timezone: "America/Santiago"
games:
  - name: "GTA 6"
    id: "gta6"
    patterns: ["gta 6", "gta vi", "gta6", "grand theft auto vi",
               "grand theft auto 6"]

# Lista blanca de streamers (DEPRECADO Fase 4.1: la lista única es
# streamers.yaml; esto queda solo como respaldo si ese archivo no
# existe). REGLA DEL USUARIO (2026-11-16): estar en esta lista =
# permiso ya dado por el hecho de que el usuario lo subió; no hay
# ficha de permiso. Para agregar un streamer, usa
# `clipagent add <link>` (escribe en streamers.yaml):
allowlist:
  - illojuan

channel:
  name: "El Clip de GTA 6"
  handle: "@elclipdegta6"
  game: "GTA 6"
  streamer: ""            # streamer del VOD (vacío = cualquiera)
  niche: "clips de directos"
  language: "es"          # es | en | both

hashtags:
  es:
    - "#GTA6"
    - "#GTA6Clips"
    - "#ElClipDeGTA6"
    - "#GTA"
    - "#RockstarGames"
    - "#gaming"
  en:
    - "#GTA6"
    - "#GTA6Clips"
    - "#GTA"
    - "#RockstarGames"
    - "#gaming"
    - "#clips"

clips:
  crop: "center"          # center | left | right
  crf: 23
  preset: "fast"
  # REGLAS DE DURACIÓN (decisión del usuario 2026-11-18, ver rules: abajo;
  # reemplaza el mínimo 36 s de 2026-11-17): entre 40 y 60 s, nunca menos
  # de 40 ni más de 60. El clip publicado de 21 s era "muy poco" y el de
  # 38 s (Rubius p2010) también queda fuera. El rango prohibido por la
  # regla de oro (25-35 s) sigue vigente. Por eso: mínimo 40 s; objetivo
  # 40 s = 20 s de pre-roll + 20 s tras el pico (payoff a 20 s dentro
  # del clip); tope duro 60 s = máximo de un Short de YouTube y tope
  # del proyecto, nunca el default. refine_cut alarga (nunca recorta)
  # cualquier corte por debajo del mínimo, y policy.py lo retiene.
  duration: 40            # duración del clip en segundos (legado, = target)
  target_duration_s: 40   # objetivo del corte (default)
  min_duration_s: 40      # mínimo: 40 s (decisión del usuario 2026-11-18)
  max_duration_s: 60      # máximo del corte variable = tope duro 60 s
  hard_cap_s: 60          # tope duro absoluto, nunca se pasa
  forbidden_duration_range: [25, 35]  # regla de oro: ningún clip de 25-35 s
  precise_cut: true       # afinar inicio/fin por frase/silencio si se puede
  pre_roll: 20            # segundos antes del pico (regla: 20 s de contexto)
  window: 10              # ventana de chat en segundos
  min_separation: 60      # separación mínima entre picos
  chat_window_s: 120      # REGLA DEL USUARIO 2026-11-17 23:00: con --peak,
                          # del chat solo la ventana alrededor del momento
                          # (±120 s del pico), nunca el chat entero
  # Layout split vertical RDJavi (regla 2026-11-16, invertido
  # 2026-11-18): streamer ARRIBA, gameplay ABAJO, sobre 1080x1920
  # (ver sección layout: variante RDJavi por defecto para GTA 6).
  # Los subtítulos viven en la zona de juego, nunca sobre la cámara
  # (ver subtitles abajo). split_game_h/split_cam_h son del split
  # simple (fallback "plain": cámara 600 arriba / juego 1320 abajo).
  split_game_h: 1320      # alto del panel de juego (split simple)
  split_cam_h: 600        # alto del panel de cámara (split simple)

subtitles:
  default_style: "rdjavi" # rdjavi (default, plantilla v2 2026-11-18) | karaoke | ref | tiktok | highlight
  subtitle_lang: "auto"   # auto | es | en — idioma de salida de los subtítulos
  translate: true         # si se traduce a inglés lo que no sea español
  # REGLA DEL USUARIO 2026-11-17 22:10: SIEMPRE subtítulos, COMPLETOS.
  # Todo clip lleva subtítulos quemados de TODO lo que dice el
  # influencer, no solo del pico. Sin subtítulos no se publica.
  required: true              # subtítulos obligatorios en todo clip
  complete: true              # transcribir el clip entero, no solo el pico
  block_without_subtitles: true  # sin SRT quemado -> clip BLOQUEADO, no publicable
  needs_human_transcription_on_no_speech: true  # si Whisper no encuentra voz, lo revisa el usuario de oído, no se publica sin subtítulos ni se inventa texto

  # ZONA DE SUBTÍTULOS (plantilla v2, 2026-11-18): los subtítulos
  # viven ENTEROS en la barra negra inferior (1740-1920 px,
  # MarginV 12), NUNCA sobre la webcam (0-702 px) ni sobre el
  # gameplay (800-1740 px, ahí van los subtítulos propios de
  # GTA 6). Con Alignment=2 (abajo, centrado) MarginV es la
  # distancia desde el borde inferior. burn_subtitles() deja el
  # MarginV dentro de la barra.
  subtitle_zone: "bottom_bar"  # bottom_bar (v2) | gameplay (viejo, prohibido)
  subtitle_safe_gap_px: 80    # hueco entre el texto y la cámara (split simple)
  subtitle_bottom_reserve_px: 0  # sin reserva: la barra ES la zona de subtítulos
  subtitle_game_bottom_px: 1740  # el gameplay termina en y=1740 (RDJavi v2)

  # VAD + anti-alucinación — v2.6 (bloque 5 de la revisión interna):
  # faster-whisper con vad_filter y umbrales que cortan las
  # alucinaciones en ruido de juego (música, efectos, sin voz).
  vad: true                   # vad_filter=True en faster-whisper
  no_speech_threshold: 0.6    # segmento con prob. no-speech mayor -> se descarta
  compression_ratio_threshold: 2.4  # texto demasiado repetitivo -> se descarta
  logprob_threshold: -1.0     # segmento con logprob menor -> se descarta
  # Puerta "sin voz" (REGLA 2026-11-17 22:10: ya NO es vía libre):
  # si el clip tiene menos palabras que el mínimo (por cada 60 s)
  # o la voz cubre menos del 10% de la duración, NO se genera SRT
  # ni se quema nada, PERO el clip queda BLOQUEADO para publicar
  # (needs_human_transcription=true, publish_blocked=true) hasta
  # que el usuario lo transcriba de oído. Nunca se publica sin
  # subtítulos y nunca se quema texto alucinado.
  no_speech_min_words: 5      # palabras mínimas por cada 60 s de clip
  no_speech_min_ratio: 0.10   # cobertura mínima de habla (0,10 = 10%)
  # Escalado condicional tiny -> base (SOLO si salta un umbral
  # objetivo; nunca base por defecto: tiny es varias veces más rápido).
  escalate: true
  escalate_min_words_per_min: 8   # <8 palabras/min con voz -> base
  escalate_logprob: -0.8      # logprob medio por debajo -> base
  escalate_lang_prob: 0.5     # idioma con prob. menor -> base
  escalate_max_repeats: 3     # misma palabra/frase >=3 veces -> base
  # Idioma por tramos: se detecta en trozos de 30 s y se vota por
  # mayoría; el empate lo desempata el idioma mayoritario del chat.
  language_chunk_s: 30
  # Fallback de idioma (si el voto empata o no hay voz clara):
  # 1º idioma del streamer, 2º idioma del canal (channel.language).
  streamer_language: ""       # es | en | ... (vacío = usa el del canal)
  chat_language: ""           # idioma mayoritario del chat, para desempatar
  # Diccionario GTA 6 (~25 términos): va como initial_prompt a
  # Whisper y como correcciones deterministas post-SRT (abajo).
  gta6_terms:
    - "GTA 6"
    - "Grand Theft Auto VI"
    - "Lucia"
    - "Jason"
    - "Leonida"
    - "Vice City"
    - "Rockstar Games"
    - "qué jugada"
    - "qué locura"
    - "clutch"
    - "no puede ser"
    - "qué acaba de pasar"
    - "vamos"
    - "brutal"
    - "insano"
    - "qué risa"
    - "GG"
    - "W"
    - "pog"
    - "clip"
    - "chat"
    - "hype"
    - "gameplay"
    - "misión"
    - "atraco"
  # Correcciones deterministas post-SRT: solo lo que está en este
  # mapa se toca, por palabra/frase completa, sin inventar nada.
  gta6_corrections:
    leonida: "Leonida"
    leonidas: "Leonida"
    vice city: "Vice City"
    vicecity: "Vice City"
    gta 6: "GTA 6"
    gta vi: "GTA 6"
    gta 5: "GTA 5"
    grand theft auto: "Grand Theft Auto"
    rockstar: "Rockstar"
    lucia: "Lucia"
    lucía: "Lucia"
    jason: "Jason"

# Política de traducción de subtítulos (regla del usuario, 2026-11-16):
#   * audio en español -> subtítulos SOLO en español, sin traducir.
#   * audio en CUALQUIER otro idioma (rumano, inglés, etc.) ->
#     traducir los subtítulos al inglés (faster-whisper task="translate").
# Es decir: transcribe en español si es español; si no, traduce a inglés.
subtitle_policy:
  es: "transcribe-only"   # español: transcribe, nunca traducir
  others: "translate-to-en" # resto de idiomas: traducir a inglés

# Estilos de subtítulo elegibles (plantillas con
# preview). Se eligen con --subtitle-style en subtitles.py.
# margin_v 12 en todos (plantilla v2, 2026-11-18): con
# Alignment=2 el texto queda en la barra negra inferior
# (1740-1920 px), nunca sobre el gameplay (ahí van los
# subtítulos propios de GTA 6) ni sobre la cámara (0-702 px).
subtitle_styles:
  rdjavi:                 # plantilla v2 (default): subtítulos fijos
    # amarillos, Arial Black 64 px reales, contorno negro grueso,
    # en la barra negra abajo del todo. Sin karaoke.
    font_color: "#FFFF00"
    border_color: "#000000"
    border_width: 6
    fontsize: 64
    bold: true
    margin_v: 12
    max_chars: 20
    max_duration: 2.0
    box: false
  ref:                    # una línea, letra chica fina, blanca con
    # contorno negro, sin fondo ni resaltado palabra por palabra,
    # en la barra negra inferior.
    font_color: "#FFFFFF"
    border_color: "#000000"
    border_width: 2
    fontsize: 32
    bold: false
    margin_v: 12
    max_chars: 42
    max_duration: 3.0
    box: false
  tiktok:                 # clásico: blanco, negrita, borde negro, abajo
    font_color: "#FFFFFF"
    border_color: "#000000"
    border_width: 3
    fontsize: 48
    bold: true
    margin_v: 12
    max_chars: 20
    max_duration: 2.0
    box: false
  highlight:              # amarillo resaltado, con caja semitransparente
    font_color: "#FFFF00"
    border_color: "#000000"
    border_width: 2
    fontsize: 52
    bold: true
    margin_v: 12
    max_chars: 20
    max_duration: 2.0
    box: true
  karaoke:                # palabra por palabra con cambio de color (ASS \k real):
    # la palabra activa va en amarillo, el resto en blanco; grande,
    # negrita, borde negro, centrado abajo. Opción secundaria desde
    # la v2 (2026-11-18): el default es rdjavi (fijo amarillo).
    font_color: "#FFFFFF"       # palabras pendientes: blanco
    active_word_color: "#FFFF00" # palabra activa: amarillo
    border_color: "#000000"
    border_width: 4
    fontsize: 56
    bold: true
    margin_v: 12
    max_chars: 8
    max_duration: 1.0
    box: false

# Layout RESPONSIVE (regla del proyecto, 2026-11-16): el recorte vertical
# no es un recorte ciego al centro. Cada clip decide su layout por
# fotogramas muestreados (ver layout.py):
#   * dos webcams lado a lado -> se apilan, una encima de la otra.
#   * una webcam + gameplay -> gameplay completo con la webcam en PiP
#     arriba (nunca abajo: minimapa y HUD de GTA).
#   * solo gameplay -> recorte vertical centrado normal.
#   * si el layout cambia dentro del clip, se adapta por tramos.
layout:
  mode: "auto"          # auto | stack | split | pip | center
  # auto decide por fotogramas: dos cams -> stack (apiladas); una cam
  # + gameplay -> split vertical RDJavi (streamer ARRIBA, gameplay
  # ABAJO, por defecto para GTA 6 — el panel es solo GTA 6); solo
  # gameplay -> center. pip (webcam encima del juego) solo queda
  # como override manual explícito, no es el default.
  # VARIANTE DEL SPLIT (2026-11-18): "auto" resuelve por juego: GTA 6
  # -> "rdjavi" (reel de referencia de RDJavi, Df4sy4bxlmr, con
  # branding Vice City: fondo desenfocado arriba 0-730, webcam
  # centrada 580x590 en (250,190) con esquinas redondeadas y 50 px de
  # solape, gameplay 730-1770, banda inferior 1770-1920 con barra
  # atardecer rosa/violeta/naranja + handle del canal; subtítulos
  # chicos en español en la parte baja del gameplay). "plain" es el
  # split simple (cámara 600 arriba / juego 1320 abajo). "djmariio"
  # (Df4uyMVjDwq) está APARCADO por orden del usuario 2026-11-18: si
  # se pide, se resuelve a "rdjavi", no se usa como layout.
  split_variant: "auto"  # auto | rdjavi | plain | djmariio (aparcado)
  # DETECCIÓN DE ENCUADRE (2026-11-18): la caja de la webcam dice si
  # el streamer muestra SOLO LA CARA (plano medio, RDJavi) o su SETUP
  # en plano ancho (DJ Mariio). Se registra en el manifiesto; mientras
  # DJ Mariio esté aparcado, el layout sigue siendo RDJavi.
  framing_wide_aspect: 1.8       # aspecto >= 1.8 = plano ancho
  framing_wide_width_frac: 0.6  # y ancho >= 60% del frame
  # BRANDING GTA 6 / VICE CITY (2026-11-18): handle centrado en la
  # banda inferior + barra atardecer en la costura gameplay/banda.
  channel_handle: "@ELCLIPDEGTA6 | GTA VI"
  sunset_colors: ["#FF2E88", "#7B2FFF", "#FF9E00"]  # rosa, violeta, naranja
  # PUNCH-IN (2026-11-18): zoom cerrado puntual sobre la webcam en un
  # momento de reacción (excepción del reel: la cámara es fija salvo
  # ese momento). Tiempos relativos al tramo. null = sin punch-in.
  punch_in: null
  sample_every_s: 5     # muestrear un fotograma cada N segundos
  min_segment_s: 3      # un tramo más corto se fusiona con el vecino
  pip_width: 480        # ancho de la webcam en PiP (px, sobre 1080)
  pip_corner: "top-right" # top-right | top-left
  pip_margin: 24        # margen de la webcam PiP al borde
  # Bloque 4: escaneo por tramo + zonas seguras + fondo borroso.
  scan_enabled: true    # escaneo por diferencia de frames cada 2 s
  scan_every_s: 2       # 1 fotograma cada N s para el escaneo
  blur_radius: 20       # radio del boxblur del fondo al apilar cams
  game: "GTA 6"         # juego para el mapa de zonas seguras
  # Zonas seguras manuales (fracciones 0..1): mandan sobre el mapa
  # del juego y sobre lo detectado. GTA 6 día 1 no tiene mapa
  # confirmado: si el minimapa no está abajo-izquierda, fijarlo aquí.
  # Ejemplo: safe_zones: [[0.015, 0.70, 0.30, 0.985]]
  safe_zones: null

# Facecam explícita: x, y, w, h en píxeles del vídeo original.
# Si está puesta, manda sobre la detección automática.
# Ejemplo: facecam_box: [100, 80, 320, 180]
facecam_box: null

# Watcher / monitor de influencers (ver WATCHER.md).
# Vigila la lista blanca de influencers.yaml: detecta directos en vivo
# y VODs nuevos, y los encola en jobqueue.py con todos los frenos.
# Por defecto --dry-run: no encola nada sin --live explícito.
watcher:
  poll_minutes: 15        # intervalo entre pasadas en --loop (y en cron)
  max_new_vods_per_streamer_per_day: 5
  state_file: "seen_vods.json"  # VODs vistos/enqueued (gitignored, nunca se sube)
  # Credenciales de Twitch (Helix, gratis): SOLO por variables de
  # entorno TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET, o en .env en la
  # raíz (gitignored). config.yaml es versionado y NUNCA lleva
  # secretos: si aquí hubiera client_id/client_secret, se ignoran.
  # Sin credenciales, Twitch usa la ruta pública GQL (sin key, no
  # oficial, puede cambiar): sirve para monitorear; Helix es la
  # vía estable cuando el usuario configure la app en dev.twitch.tv.

# Estudio de reels virales (reel_study.py, 2026-11-16, idea del reel
# de David Madrazo "content-os"): estudiar reels de GTA, sacarles el
# patrón de hook/CTA y alimentar títulos sugeridos. SOLO patrones,
# nunca el caption copiado; sin voz clonada y sin publicar solo.
# El informe vive en reel_patterns.json (versionado, excepción en
# .gitignore); auto_clips.py lo usa si existe, si no sigue sin él.
reel_study:
  enabled: true           # auto_clips.py carga reel_patterns.json si existe
  report_file: "reel_patterns.json"
  max_urls_per_run: 10    # estudiar reels es una pasada manual, no un scrapeo
  min_sample: 5           # menos de 5 reels: muestra pequeña, se avisa

# Auto-publicación (bloque 10 de la revisión interna, 2026-11-16).
# Contador "funciona" + 4 fases + circuit breaker (ver AUTOPUBLISH.md
# y counter.py). NADA se publica solo sin pasar por las fases, y cada
# cambio de fase es manual, con confirmación. Umbrales a validar por
# el usuario.
autopublish:
  threshold: 15           # clips seguidos aprobados sin editar y publicados sin fallo
  min_days_per_phase: 3   # mínimo 3-5 días por fase antes de poder avanzar
  min_clips_per_phase: 10 # mínimo 10 clips por fase antes de poder avanzar
  veto_window_minutes:
    youtube: 30           # fase 3: ventana de veto en YouTube
    default: 120          # fase 3: ventana de veto en TikTok / Instagram / Facebook
  # Sin "whitelist" aquí: la lista blanca canónica es influencers.yaml
  # + allowed_streamers.yaml, que lee publisher.load_whitelist();
  # jobqueue.py usa además "allowlist" aquí en config.yaml (nivel
  # superior). REGLA 2026-11-16: estar en la lista = permiso ya
  # dado. Vacía en todas = fase 4 bloqueada.
  metrics_green: false    # poner true solo cuando las métricas estén en verde (revisión manual)
  # Modo de arranque (6.7): gradual conserva las fases y el contador
  # (nada automático hasta la fase 4); full publica según la
  # política 6.3 sin pasar por las fases.
  mode: gradual

# Umbrales duros del sistema de puntaje (6B.2): por defecto 90/50.
# Si se bajan, queda registrado con fecha en scoring_changes.log.
# BAJADOS 2026-11-19 por orden del usuario: el SEO 81-86 moría en
# 90 y los picos con viralidad 48-49 morían en la revisión (Gemini
# los bajaba a ~35); la prioridad es que salgan clips.
scoring:
  seo_gate: 80
  viral_min: 45
  # Pre-filtro rápido (2026-11-18, clipagent/prefilter.py):
  # 1 punto por mensaje, 2 por reacción, tramos de 10 s; un pico pasa
  # si su tramo llega a prefilter_min_multiple x la mediana de sus
  # vecinos de ±5 min. Puerta barata ANTES de Whisper/viralidad/SEO/
  # render; no toca la fórmula de viralidad, la prioridad ni los
  # filtros duros. Si ningún tramo del VOD llega al mínimo (chat
  # caliente, medido en Rubius 2932415021: máx. 2,23x), el pre-filtro
  # se desactiva solo y no descarta nada. --no-prefilter lo apaga.
  # prefilter_separation_s es el TOPE de separación entre picos del
  # pre-filtro; la puerta usa min(--min-separation, este valor)
  # porque select_top_peaks ya dedupó y el pre-filtro no puede ser
  # más agresivo que el pipeline (con 90 s se perdía el pico real
  # de 90 s, a 50 s del de 40 s).
  prefilter_min_multiple: 3.0
  prefilter_separation_s: 90
  # 7.2: peso del componente audio del score de viralidad. En Kick
  # es mayor (1,5): el chat es menos fiable como señal y el audio
  # manda más. Con estos valores el total no cambia.
  audio_weight: 1.0
  audio_weight_kick: 1.5

# Señales de Uri (clipper-directos, 2026-11-17): heatmap de YouTube,
# % de juego en movimiento y voz del juego. Son DIAGNÓSTICO en el
# manifiesto (signals.*): NO cambian la fórmula de viralidad (7
# componentes), ni la de prioridad, ni los filtros duros, ni el
# ritmo anti-ban. Sin yt-dlp o sin heatmap, el heatmap queda
# "available: false" y el pipeline sigue solo con el chat.
signals:
  heatmap:
    enabled: true         # leer el heatmap si el VOD es de YouTube
    bucket_s: 10          # ancho del bucket (como Uri)
    top_n: 15             # picos a devolver
    min_separation_s: 60  # separación mínima entre picos
    max_gap_s: 30         # un pico de heatmap solo confirma el pico de chat si está a <= 30 s
  motion:
    enabled: true         # medir % de movimiento en el clip cortado
    threshold: 3.0        # diferencia media por segundo para "se mueve" (como Uri GAME_MOV)
    frozen_max_pct: 10.0  # 0-10% = vídeo en pausa / pantalla fija (criterio de Uri)
    strong_virality_min: 85  # viralidad >= 85 (urgente) para que un clip congelado valga
  game_voice:
    enabled: true         # detectar voz del juego (silencio del streamer + audio activo)
    silence_s: 2.0        # el streamer calla >= 2 s mientras suena el juego
    active_dbfs: -45.0    # RMS por encima de esto = hay sonido de juego

# Aprobación automática por política (6.3): sin humano por clip.
# min_band: null = sin requisito de banda.
auto_approve:
  enabled: true
  min_band: null

# Metadata del paquete (7.5): crédito al streamer en la descripción.
metadata:
  credit_streamer: true

# Directos en vivo (9.2): cooldown entre clips del mismo streamer y
# tope de clips por directo. segment_minutes es la duración prevista
# de cada segmento grabado (5-10 min) cuando la grabación esté
# disponible (hoy BLOQUEADA: sin descargador de directos).
live:
  cooldown_minutes: 10
  max_clips_per_stream: 5
  segment_minutes: 5

# Circuit breaker por plataforma (6.4): N fallos seguidos o un
# rechazo por copyright/strike pausan SOLO esa plataforma.
breaker:
  max_consecutive_failures: 3

# Fan-out: al publicar un clip en YouTube Shorts, se intenta
# publicar también en TikTok, Instagram Reels y Facebook Reels,
# cada una con sus propias puertas (puntaje, cuota, breaker,
# auditoría). enabled: false = sin propagación desde YouTube.
fanout:
  enabled: true

# URL pública del video (fan-out): Instagram exige que Meta
# descargue el video desde una URL HTTPS pública. Esto NO sube
# nada: es la base del hosting estático donde TÚ sirves los clips
# (por ejemplo, el directorio runs/ publicado en un hosting con
# HTTPS). La URL final es base + ruta relativa del clip en el repo.
# Sin base, Instagram queda en draft con el motivo explícito.
# También vale CLIP_PUBLIC_BASE_URL en .env (manda el entorno).
public_url:
  base_url: ""

# IDs de cuenta por plataforma (fan-out): Instagram necesita el
# ig_user_id y Facebook el page_id. No son secretos. Se sacan de
# Meta (Graph API Explorer o la configuración de la app). Vacíos =
# draft con el motivo explícito. También valen IG_USER_ID y
# FACEBOOK_PAGE_ID en .env (mandan sobre esto).
platform_accounts:
  instagram_reels:
    ig_user_id: ""
  facebook_reels:
    page_id: ""

# Panel web (regla del usuario: TODO ES PARA LA WEB, NADA LOCAL).
# El panel vive en Cloudflare (Pages + Worker + D1) y es la única
# superficie de operación: login por usuario, cada tenant ve solo
# lo suyo. Sin secretos aquí: las credenciales van en GitHub
# Secrets / D1 cifrado, nunca en config.
panel:
  base_url: "https://avc-em9.pages.dev"
  worker_url: "https://avc.vikingosfoodspa.workers.dev"

# REGLAS OBVIAS DEL PROYECTO (decisiones del usuario, 2026-11-16/17).
# Antes estaban dispersas en docs, panel y varios .py; este bloque es
# la única lista canónica en config. El código las impone (ver
# clipagent/config.py RULES, precise_cut.py, transcribe.py y
# policy.py); si una regla cambia, cambia aquí Y en el código.
rules:
  # Duración: entre 40 y 60 s, nunca menos de 40 ni más de 60, nunca
  # 30 s exacto (decisión 2026-11-18; reemplaza el mínimo 36 s de
  # 2026-11-17: el clip de 21 s publicado en test era "muy poco" y
  # el de 38 s (Rubius p2010) también queda fuera).
  min_duration_s: 40        # mínimo: 40 s (decisión del usuario 2026-11-18)
  target_duration_s: 40     # objetivo: 40 s (20 pre-roll + 20 post-pico)
  hard_cap_s: 60            # tope duro: 60 s (máximo de un Short)
  forbidden_duration_range: [25, 35]  # regla de oro: ningún clip de 25-35 s
  pre_roll_s: 20            # 20 s de contexto antes del pico
  # Layout split vertical RDJavi (2026-11-16, invertido 2026-11-18):
  # streamer arriba, gameplay abajo, sin superponerse (salvo los 50 px
  # de solape de la webcam RDJavi); si el juego no se ve, la cámara se
  # achica, nunca al revés. Nunca tapar minimapa ni HUD.
  layout_split: true
  never_cover_minimap_or_hud: true
  # Subtítulos (2026-11-17): siempre en la zona de juego, nunca
  # sobre la cara del influencer / la webcam. MarginV de referencia 230, mínimo 200.
  subtitles_never_over_webcam: true
  subtitle_zone: "gameplay"
  # Juego verificado: nunca afirmar en título/descripción un juego
  # que no está verificado en el clip (ej. decir GTA 6 sobre GTA V).
  never_claim_unverified_game: true
  # Subtítulos falsos: si no hay voz inteligible, NO quemar lo que
  # alucinó Whisper. Usar la transcripción corregida por el usuario
  # (*.transcript_corrected.json en el run) o no quemar nada.
  never_burn_hallucinated_subtitles: true
  user_corrected_transcript_wins: true
  # Subtítulos SIEMPRE y COMPLETOS (regla 2026-11-17 22:10):
  # todo clip lleva subtítulos quemados de todo lo que dice el
  # influencer; sin subtítulos no se publica.
  subtitles_always: true
  subtitles_complete: true
  block_without_subtitles: true
  # Categoría (regla 2026-11-18): solo vale GTA VI. El
  # watcher/detector lee la categoría por API oficial (Helix
  # /streams y /channels en Twitch, /api/v2/channels en Kick) y
  # por capítulos del VOD; policy.py y el gate del panel la exigen.
  category_gta6_only: true
